  n('另一件是，有些账算不得。头一年他天天在心里算，那天要是封了退路会怎样，要是根本没去又会怎样。算了大概半年他就停了，他发现自己算出来的每一条活路，都得踩在别人的死路上。'),
  {show:'q'},
  s('q','那时候我才明白，这本账本来就是亏的，跟我算没算清没关系。'),
  n('出狱那天没人来接。他站在监狱门口，口袋里揣着一张车票和一点零钱，却没上那趟车。'),
  n('孙建平住在哪儿，他打听了好几天才问到。人早就不在医院了，住在城西一栋旧楼的顶层。他没上楼，站在楼对面的树荫里。楼门口停着一张轮椅，旁边蹲着一个年轻人，正在拧轮椅的刹车。'),
  n('Q在树底下站了好一会儿，最后没有过去。'),
  s('q','我为什么不过去？那时候我实在想不出一个理由。过去了说什么呢，说对不起？对不起这句话又不会长出骨头来。'),
  n('那个年轻人就是Eric。Q那时候不知道他叫什么，只知道轮椅上那个人，就是那天追下来的人。'),
  n('他走了。后来他洗了一阵车，在照相馆门口碰上了Younghoon。Younghoon把他带去见了团长，他就在团里待了下来。'),
  n('Eric是过了两年多才来的。Eric进门那天，跟每个人都打了招呼。Q那天坐在角落里捏蜡，没怎么理他。'),
  me('你当时就认出来了？'),
  s('q','认出来了。我这辈子记得住的脸没几张，那张脸我在树底下见过。'),
  me('那你为什么不说？'),
  s('q','说什么呢？说我见过你爸坐轮椅，说那天追我的人就是他？'),
  s('q','我怕的是他打我的时候，我心里还觉得他不该打。其实他该打。'),
  {bg:'bg_warehouse'},
  n('Eric在团里待了一年半。他跟Q分过炸鸡，换过位置，一起出过好几回活儿，两个人从来没多说过一句话。'),
  n('Hyunjae有一回说：「你们俩好像认识啊。」Q说「不熟」，Eric也说「不熟」，两个人几乎是同时说出口的。'),
  s('q','那一下我心里咯噔了一声。两个人能一块儿说不熟，那就是都熟。'),
  n('他说这话的时候，正替我把一只卡住的抽屉往外拔。拔出来以后，他顺手把轨道上的灰抹干净，才还给我。'),
  {bg:'bg2_box'},
  n('第三季末尾，Eric去找了Q。那天我在门外，门没关严。'),
  n('Eric把父亲的一张旧照片给了Q。照片上的人穿着垣卫的灰制服，很年轻，站得笔直。Q接过去看了很久，让他自己留着。'),
  s('eric','这是我爸，是他摔之前的样子。给你。我留着它，就一直停不下来数。给了你，我就不用再数了。'),
  s('q','数什么？'),
  s('eric','他摔了以后，我守在床边数他的呼吸，数了好几千下。后来他睡着了，喘匀了，我还在数。'),
  s('q','你数完了没有？'),
  s('eric','还没有。'),
  s('q','那就等数完了再给我。这种东西不能只给一半。'),
  n('Eric愣了很久，然后笑了起来，笑着摇头说：「你这个人也太较真了。」'),
  s('q','是啊，较真的人才会替你看着门。'),
  n('那天晚上Q一个人回了住处，坐到很晚，把红蜡拿出来捏了一会儿，那截蜡已经只剩最后一小截了。'),
  n('第二天早上他来找我，说要跟我说件事：「我昨晚差点去找他。」'),
  me('为什么没去？'),
  s('q','怕去了说错话。我这人不会说话，这辈子靠手吃饭，不靠嘴。那么重的事，我怕自己说岔了。'),
  me('你想跟他说什么？'),
  s('q','我想说，那天在楼梯间，我要是封了退路，他爸就不会摔。可我也想说，就算我不去开那个柜子，也会有别人去开，这一行永远有人补位。'),
  me('这两句话是拧着的。'),
  s('q','对，所以我一直没说。拧着的话说出来，人家只会觉得你在推。'),
  me('可你确实没封退路。'),
  s('q','我确实没封，这个错是我的，一辈子都是我的。我只想让他知道，我错在没封退路，我从来没想过要弄断他爸的腰，这两件事差得很远。'),
  {p:'',c:[

    {t:'「你该自己去说。」',tone:'cold',then:[
      n('他点了点头，没接话。后来那条巷子，他还是自己去了。')]},

  {bg:'bg2_street',fx:'lightrain'},
  n('后来他去了档案馆后街那条巷子。孙建平摔断腰的那个楼梯间就在巷子尽头，门早就封了，水泥抹得坑坑洼洼。那天下着小雨，他一个人走进去，两只手插在口袋里，我撑着伞在巷口等。'),
  n('过了一阵，巷子另一头有人撑着伞进来了，是Eric。两个人就那么站着，谁都没往前走。'),
  s('eric','我爸后来再也没站起来过。'),
  s('q','我知道。'),
  s('eric','我原来想揍你一顿。'),
  s('q','现在揍也行。'),
  n('Eric摇了摇头：「不揍了。我想了很久，想到最后发现揍完了也没用，我爸还是坐在轮椅上。」'),
  n('后来是Eric先动的。他往前走了一步，把伞往Q那边偏了偏，说：「你的伞漏了。」'),
  n('两个人就站在一把伞底下，站在那扇封死的门前，一直站到雨小下来。'),
  n('回去的路上，Eric走在我旁边，伞收起来拎在手里。'),
  s('eric','我爸这辈子最不服的，就是有人跟他讲道理。他说道理都是讲给站着的人听的，断了腰的人没道理可讲。'),
  me('那你今天跟他讲了吗？'),
  s('eric','没讲。今天我才知道，有些事用不着讲完。'),
  {bg:'bg2_post'},
  n('那以后，Q的铺子多了个常客。Eric每回送东西来，从来不进门，只站在门口把东西递进来。这样过了大半年。'),
  n('有一天下午，Eric站在门口，手里空空的，站了一会儿才说：「我的伞还在你这儿。」又问卷闸门晚上卡不卡，冬天呢。然后他帮着调了一整个下午。'),
  n('调完他站在门口，两只手全是黑的，Q递给他一块布。'),
  s('q','原来是擦蜡用的，现在不是了。'),
  {bg:'bg2_tea'},
  me('这笔账到底什么时候能清？'),
  s('q','清不了。可清不了，也不等于一直欠着。'),
  me('那算什么？'),
  s('q','算是有人跟你一块儿记。一个人记，那叫欠；两个人一起记，才叫账。'),
  n('那天他从柜台底下拿出一样东西给我看，是他十九岁那年用的那把锉刀。进去之前被收走了，出来以后他托人找了两年才找回来，刀柄上缠着一圈旧胶布，胶布早就硬了。'),
  me('你留着它干什么？'),
  s('q','提醒自己。我这辈子就干一件事，替人开门，开门的人得站在门这一边。'),
  n('他把锉刀收回去，推上抽屉，推到最后一点时停了停。'),
  s('q','现在我站在门这边，门外头有人等着我开门，这就不一样了。'),
  me('门外头是谁？'),
  n('他没答，弯腰把卷闸门的插销拔了。门外是傍晚空荡荡的街，门口立着我刚放下的那把伞。'),
  {if:'lnQRemember',then:[
    n('又过了一阵，Eric来铺子的时候手里拿着那张照片，这回是整张的。他把照片放在柜台上，推到Q面前，说他数完了。Q看了很久，从抽屉里拿出一个空相框，把照片装了进去，立在工作台的最里头，正对着门。'),
    s('eric','你立在那儿，是想让他看着你干活吗？'),
    s('q','是让他看着门。他守了一辈子门，这回换个好点的位置给他守。')]},
  n('（番外完）'),
  {softEnd:1},
];

/* 《三个长夜》· Sunwoo｜一口钟，一个人 */

  {card:'一口钟，一个人',sub:'三个长夜 · Sunwoo'},
  {bg:'bg2_clock'},
  n('Sunwoo他爸那双手，是天底下最稳的手之一。老金做了一辈子钟，值夜组那口十二孔的钟就是他做的，编号一直排到〇一六。他能一只手扶着钟壳，一只手拧螺丝，拧的时候眼睛都用不着看。'),
  n('Sunwoo还小的时候，就开始觉得他爸的手在抖。先是拿筷子抖，后来拿杯子也抖，到最后手搁在桌上什么都不拿，也在轻轻地跳。医生说是神经上的毛病，跟失眠有关，也跟心里的事有关。'),

  {bg:'bg2_dark'},
  n('那年的一个凌晨，Sunwoo起来喝水，看见阳台上有火光。他爸蹲在一只搪瓷脸盆前面，往盆里一页一页地放纸，纸是蓝格子的，烧起来卷着边。'),
  n('Sunwoo光着脚站在门口看了很久。他看见他爸一边烧一边擦脸，擦完了接着烧。烧到最后，他爸把剩下的纸全塞进脸盆，站起来一回头，两个人对上了眼。'),
  n('他爸伸出脚，把脸盆往自己身后拨了拨，说了一句回去睡吧。Sunwoo就回去睡了。'),
  {show:'sunwoo'},
  s('sunwoo','那是我这辈子见过最狼狈的掩护。那盆火他烧了快一夜，我一抬头就看见了，他拨那一下根本来不及。我一直想不通，他明知道来不及，为什么还要拨。'),
  {bg:'bg2_clock'},
  n('从那年冬天起，他爸开始听钟。家里那口钟早就砸了，可他爸夜里坐在床上，侧着耳朵，说听见钟在响。'),
  n('Sunwoo就是那时候开始学做钟的。他说他必须学得快，他要给他爸做一口真的钟，用真的钟声把他爸耳朵里那口假钟换掉。'),
  n('他花了大半年做出来一口，木壳，走得极准，底下刻了一个号，〇一七。他爸排到〇一六，他就接着往下排。他把钟搬到他爸床边，上满了弦，那一夜他爸睡得很沉。'),
  s('sunwoo','这是我记得的最好的一件事。后来他还是走了，那年冬天我十四岁，他走的时候，手是停着的。'),
  {bg:'bg_warehouse'},
  n('团里那口散伙钟是Sunwoo做的，他从来没跟人说过他爸也做钟。他进团以后最出名的一件事，是记得住那十二个孔的手感，哪一格涩，哪一格顺，哪一格要往回带一点。'),
  me('你为什么总在夜里上弦？'),
  s('sunwoo','夜里静，静了我能听见弦拉紧的那一声。拉到某个点会有很轻的一声，过了这个点就紧得不对了，差一点又松，这个点只有静的时候才听得出来。'),
  n('他说着，把我的手拉过去，按在钟壳上，让我听。'),
  {p:'手心底下，钟壳是凉的。',c:[
    {t:'「我听见了。」',tone:'cold',set:{lnSwHeard:1},then:[
      n('他看了我一眼，把我的手往下挪了一寸，换到底座那一格。'),
      s('sunwoo','刚才那儿什么都没有，你听见的是你自己。这一格才有，你再听一回，这回别急着说。'),
      n('我又听了一会儿，这回只听见他在我旁边慢慢地喘气。他也没再拆穿我，把手松开了。')]},
    {t:'「我只听见心跳。」',tone:'soft',tr:{sunwoo:1},set:{lnSwHeart:1},then:[
      n('他看了我一眼，好像他听出来了点什么，又好像只是在等我把手拿开。他自己先把手松开了，拿起扳手去拧下一格，拧了半天也没拧上。'),
      s('sunwoo','心跳也算一种。你那一下比钟快，快了差不多一倍，我刚才数了。')]},
  ]},
  n('钟停在四十一那一夜，他翻来覆去说了好几回「不是我上的」。后来我们才明白，他说那几遍，跟怕被人怀疑关系不大。'),
  s('sunwoo','那口钟是我做的，钟出了事，头一个该查的就是我。我认了钟是我做的，就得认它在我手里出了错。可是认了以后，我还能干什么呢？我这辈子能干的就一件事，把钟弄准，现在钟不准了，我都不知道自己还能干什么。'),
  {bg:'bg2_clock'},
  n('第三季结束以后，他把那口钟又拆了一遍，这一回总算找到了。底座里垫着一片很薄的铜片，卡在两个齿之间，走满一段日子，正好让钟停在那个钟点上。那个位置，只有懂老金那一套做法的人才找得到。'),
  n('他把铜片取出来搁在长桌上，跟大家说了一声。沈眠早就认过了，大家都在忙自己的事，Hyunjae抬头看了一眼，说钟走得好好的就行。'),
  n('那天晚上他一个人在钟前面坐了很久。'),
  s('sunwoo','我一直以为自己最怕的是钟坏了没人修，今天才发现，我更怕的是修好了没人在乎。其实我就是想让它准，它准了我心里就踏实，这事只跟我自己有关系，我老是想把它跟别人扯到一块儿去。'),
  {p:'桌上那片铜片：',c:[

      s('sunwoo','你连这个都记啊。'),
      me('你在乎的，我就记。'),

    {t:'推回给他，让他自己收着。',tone:'cold',then:[

      s('sunwoo','也行，这东西还是我自己收着踏实。')]},

  {show:'sunwoo'},
  s('sunwoo','你看这儿，转到这个卡口手感会变。好多人转到这儿就停了，以为再转要断，其实得过了这个点再多转一点，才算上满，上满了才走得准。'),
  me('这个点叫什么？'),
  s('sunwoo','它还没名字，你要起一个也行，别起得太难听。'),
  n('那天他坐在我对面教了我好一阵，教完了问我会了没有，我说会了。'),
  s('sunwoo','那以后你自己上。我替人把事全做完了，人就学不会了，教你上弦比替你上弦有用。你要是忘了也可以来找我，我再说一遍，不收钱。'),
  n('后来我问他，钟和人，哪个更难修。'),
  s('sunwoo','人。钟坏了有个准头，弦该松该紧，齿轮该转该停，都有个数。人老是一会儿松一会儿紧，得有一双耳朵一直听着。我听钟听了十几年，听人还是头一回。'),
  me('那现在听得怎么样了？'),

  {if:'lnSwCopper',then:[

  n('（番外完）'),
  {softEnd:1},

      {show:'q'},

      s('q','算不上。我这辈子就这一门手艺，洗了手，我就什么手艺都没了。'),
      n('头一个月铺子里冷冷清清。第二个月来了头一个客人，是个老太太，说家里的锁关不上。他去人家门口蹲了一阵，把锁舌里卡着的东西抠出来，锁就好了。老太太要给钱，他摆摆手，一分也没收。'),
      s('q','收了钱，她下回就要换一家了，我这铺子得有人愿意进来。'),
      n('后来生意慢慢有了，有换锁芯的，有配钥匙的，也有忘了自家保险柜密码的。他挑活儿，来路一眼看得清的就接，得他开口问来路的就推回去。有一回一个人拿来一把崭新的锁，要配好几把钥匙，一出手就给了几倍的钱，他把锁推了回去，说这锁跟他配的那一路对不上。'),
      n('那天晚上我陪他关铺子。他把工具一样一样收进抽屉，最后从里面摸出一小截红蜡，在手心里捏成一个方块，第一季他就在桌子底下这么捏。'),
      me('还没戒掉啊？'),
      s('q','戒不掉。不过我现在拿它擦柜子缝，柜子缝老是积灰，封门那一套我早就收起来了。跟你说件事，我这铺子缺一个收钱的人。我讲不来价，老太太说给多少就是多少，小孩来配钥匙我也照收一块，这样下去铺子迟早要关门。'),
      me('你这是在招人？'),
      s('q','我这是在问你。你要是忙，就算了。'),
      {p:'他在等你回答。',c:[
        {t:'「我不忙。」',tone:'soft',tr:{q:1},then:[
          n('他把卷闸门拉下来，拉到一半，弯下腰从底下看着我。'),
          s('q','那我就当你说了不忙。明天早上八点开门，收钱的抽屉在左手边，钥匙我给你配一把新的。')]},
        {t:'「我考虑一下。」',tone:'cold',then:[
          n('他点点头，把卷闸门拉下来，拉到一半停住，弯下腰从底下看着我。'),
          s('q','行，你慢慢考虑。凳子我先给你留着，留多久都行，反正我这儿也就这一把凳子。')]},
      ]}],
    juyeon:[{bg:'bg2_street'},
      n('合册以后，Juyeon干了一件谁都没想到的事，他去报了驾校。他本来就会开车，这回要学的是大车。'),
      {show:'juyeon'},
      s('juyeon','以后大家出门东西多。Hyunjae买菜，New带工具，Q带一箱锁，Eric带一摞图录，每回都得跑好几趟，我开大车一趟就拉完了。'),
      n('他学了大半年。路考那天我在考场外面等，他考完出来一直走到我跟前，才说了一声过了。我问他刚才怎么不说，他说说早了怕没过。他这个人，连高兴都要等确定了才肯高兴。'),
      n('他买了一辆二手的厢式货车，灰色，后门上还有个凹坑。上车之前他总要把后厢门查三遍，开起来稳得过了头，绿灯快灭了就松油门，过弯前老早打灯，有人别他，他就让。'),
      {bg:'bg3_bus'},
      n('有一回夜里从档城回来，下着大雨，高速上全是大货车。我坐在副驾，一直没敢睡，看着他一脚一脚地点刹车。'),
      s('juyeon','你可以睡一会儿。你一直抓着扶手呢，我看见了，抓得指头都白了。'),
      n('我把手松开了。雨刮器刷过去，外面的灯光一片一片地糊开，他开了很长一段路才又说话。'),
      s('juyeon','其实我学大车还有个原因。以前我老站在门边上看，看了这么多年门，看的都是远处，看见的全是危险。坐在驾驶座上就能看见前面，我能看见路往哪儿走。'),
      me('那你现在还看门吗？'),
      s('juyeon','看，现在看的是后视镜。'),
      n('我后来才发现，他那面后视镜一直往右偏着一点，从那个角度看得见副驾。')],
    hyunjae:[{bg:'bg3_eatery'},
      n('合册那年夏天，Hyunjae在仓库隔出来的那半边开了一家店。店里只摆得下两张桌子，菜每天四样，有汤有炒饭，也有青菜和一锅炖菜，他把菜名写在门口的小黑板上，卖完一样就擦掉一样。'),
      n('开张那天一直到傍晚才来了头一个客人，是个送货的司机，说随便吃点。他做了一碗汤面端出去，就坐在对面看人家吃，把司机看得浑身不自在。后来那个司机差不多天天来，再后来工地上的几个人也来了。'),
      {show:'hyunjae'},
      me('你从小就站在灶台边上，现在自己开了店，怎么还不坐下吃？'),
      s('hyunjae','我坐着呢，就坐在他们对面，你没看见而已。我妈那个大排档开了那么多年，从来不跟客人一块儿吃，她说做饭的人一坐下，客人就不自在。我现在改了，坐是坐了，就是不吃，他们问我老板你不吃啊，我说吃过了，他们哦一声，接着吃。'),
      me('那你什么时候真吃？'),
      s('hyunjae','打烊以后。四样菜每样留一份，热着摆一桌，给自己盛一碗。说起来你别笑，我现在最拿手的是第二碗，第一碗吃得太急尝不出味，第二碗才吃得出火候。'),
      n('他说这话的时候在擦灶台，擦得很细。擦完了，他把抹布搭在水龙头上。'),
      s('hyunjae','你今天要是不走，就摆两副碗筷，第二碗你来盛。我先说好，盛少了我可要说你的。'),
      {p:'灶台上的锅还热着。',c:[
        {t:'留下来，拿起他的碗。',tone:'soft',tr:{hyunjae:1},then:[
          n('我把两只碗都盛满了。他看了一眼，说你这一勺跟陈姨一个手法，接过去先尝了一口炖菜，说今天的盐放多了，明天减一点。')]},
        {t:'说改天再来。',tone:'cold',then:[
          n('他笑了笑，把第二副碗筷收回柜子，又拿出来，摆在了桌子靠门那一头。'),
          s('hyunjae','那就摆着，哪天你来了直接坐。')]},
      ]}],
    new:[{bg:'bg2_street'},
      n('New和Sunwoo合开了一间工作室。起头只是Sunwoo转给他一个活儿，一台老对讲机，客人说修不好就扔。New花了好几天修好了，那个客人后来又带来几台，再后来带来的更多。'),
      n('于是两个人分了工，Sunwoo管电，New管壳，天天为螺丝该用十字的还是内六角的吵架。吵得最凶的一回，Sunwoo把一把螺丝刀摔在工作台上，扭头就走，走到一半又回来了，站在门口。'),
      {show:'new'},
      s('new','你摔的那把是我爷爷的。明天我给你买把新的，这把就别摔了。'),
      n('Sunwoo回来坐下，一句话也没说，接着干活。后来他们收了两个徒弟，年纪都不大，都是没地方去的孩子。New教他们从拧螺丝开始，先教摸，摸出这个东西是紧的还是松的。'),
      s('new','你们记住一件事，东西坏了，多半只是松了。真坏了就慢慢修，修好之前就先留着，留着的那段时间，它也还是好好的。'),
      n('那两个孩子管New叫师父，管Sunwoo叫师叔，Sunwoo每回听见都皱眉，说他比New还小两岁。工作台边上一直多放着一把凳子，徒弟问过是谁的，New说是给来的人坐的。'),
      {p:'那把凳子空着。',c:[
        {t:'坐下。',tone:'soft',tr:{new:1},then:[
          n('我坐了下去。New从盒子里拿出一颗螺丝放在我手心，又把那把旧螺丝刀递了过来。'),
          s('new','你拧。从左上那颗开始，拧完了回半圈。'),
          n('那把凳子我坐了一年。')]},
        {t:'站在门口看一会儿。',tone:'cold',then:[
          n('我在门口站着看他们吵了一会儿。New抬头看见我，用脚把凳子往外勾了一点，又低头去拧他的螺丝了。')]},
      ]}],
    sunwoo:[{bg:'bg2_clock'},
      n('合册以后有一阵子，Sunwoo不修钟了。他手艺还在，只是不接活儿，有人把钟送来，他一律推回去。'),
      {show:'sunwoo'},
      s('sunwoo','我从十四岁修到现在，修的全是别人家坏掉的钟。钟坏了才会送到我这儿来，我见过的钟全是坏的，就以为钟都是坏的。后来才发现钟大多数时候是好的，好的时候没人送修，也没人记得它，它就在那儿响，响到谁都听不见了。'),
      n('那一年他把长桌上那口散伙钟擦了好几回，每回都拆开来擦。后来他又接活了，只接一种，没坏的钟拿来做一次保养。'),
      n('那年秋天，他送了我一台小闹钟，铁壳，发条在背面，拧起来很费劲。他说是旧货市场淘的，没花几个钱，修了好几天。'),
      s('sunwoo','我把它调得一点不差。这么准的东西，总得有人看着，要不然它准给谁看呢？'),
      n('有一回他来家里，看见闹钟摆在床头，拿起来翻到背面看了半天，才放回去，在床边坐了下来。'),
      s('sunwoo','你知道吗，团里那口钟我调完就合上壳，从来不让人看，怕人一看就挑出毛病来。现在也怕，可给你的这只，我想让它被人看见。'),
      n('他站起来，顺手把闹钟往我枕头那边推了推。'),
      s('sunwoo','放近点，它声儿小。你别以为我是为了让你天天想起谁啊，我就是怕你听不见它响，回头又说是我没修好。')],
    younghoon:[{bg:'bg3_darkroom'},
      n('合册后的头一个春天，永明照相馆重新开了门。招牌还是原来那块，重新上了一遍漆，玻璃柜台里摆的是黑白肖像。'),
      n('他拍得很慢，一个人进门，他要先看上好一阵，看清那人的手往哪儿放，眼睛往哪儿看，才让人坐下。头几个月生意很差，后来来了一个老太太，说要给自己拍一张遗照。'),
      n('她说老伴的遗照是儿子挑的，挑了一张七十岁的，可他是五十岁的人，七十岁那几年，他已经病得认不出自己了。她想拍成自己现在这样。Younghoon拍了大半个下午，光换了好几回。照片洗出来那天，老太太戴上老花镜看了很久，说这就是我。'),
      n('她走了以后，Younghoon在暗房里一直坐到天黑。我推门进去，他嗓子有点哑。'),
      {show:'younghoon'},
      s('younghoon','想起我爸了。他一辈子给人拍证件照，说照相馆是给人做脸的，拍的全是人家要的样子。可这些人来，要的是自己的脸，我拍不出来，只能等，等他们把给别人看的那层样子放下来。'),
      n('他把一张相纸夹上晾绳，晾绳上一排夹子，最后一个空着。'),
      s('younghoon','你哪天让我拍一张吧。现在还不行，你在我面前摆的是给我看的样子，等我哪天看惯了，大概就是我不怕你走了以后。'),
      {p:'晾绳上那个空夹子。',c:[
        {t:'「我不走。」',tone:'soft',tr:{younghoon:1},then:[
          n('他愣了一下，转身从药水里捞出一张白纸，夹在了最后那个夹子上。纸上还什么都没显出来。'),
          s('younghoon','先挂着吧，它自己会慢慢出来的。')]},
        {t:'「那我等你。」',tone:'cold',then:[
          n('他点点头，把那个空夹子往里推了推，推到灯底下。')]},
      ]}],
    kevin:[{bg:'bg_warehouse'},
      n('合册以后，Kevin还站在门边那个位置，只是一点一点往里挪，挪了大半年，挪到了离门两步的地方。'),
      n('这一年他把父亲的日记整理出来，印了十二本小册子，团里十一个人一人一本，多出来的那本留给他爸。有一回我看见他坐在仓库外头，摊开册子一页一页往回翻。'),
      {show:'kevin'},
      s('kevin','我爸的日记写了大半辈子。前面那些年一天一页，什么都写，今天扣了什么货，哪个组员请假，今天下雨。后来那几年，一个月才写一页，越写越短，最后写的是今天没下雨。后面还有一页空着，他知道自己快不行了，空了一页，等他儿子来写。'),
      me('你写了吗？'),
      s('kevin','那一页我一直空着。我想先弄明白一件事，一个人做了错事，后来天天写日记，到底是在赎，还是在忍。我在门口看了这么多年的门，门是能关上的，账关不上。'),
      n('那年冬天，他把那一页给我看了。很短，就一行：今天下雨了，我把伞给了她。'),
      s('kevin','我爸最后写的是没下雨，我写下雨了。这边下雨，那边没下，两页纸就隔着一场雨。'),
      n('我认得那一天。那天在恒温库门口，他等了很久，后来下起雨来，那把伞一路都撑在我头上。')],
    eric:[{bg:'bg2_street'},
      n('Eric后来报了夜校，学档案管理，上课的地方在档城老城区。他十七岁那年书念到一半，家里要人，就停了。'),
      {show:'eric'},
      s('eric','我想知道这套东西本来是怎么走的。Q懂怎么破，我懂怎么钻，可它本来该怎么用，我还是头一回学。'),
      n('头一回上课，他坐在最后一排。老师讲到归档的头一条是保证来路可查，他低着头，肩膀一直在抖。下了课他给我打电话。'),
      s('eric','我今天在课上哭了。我花了一年多才弄明白的东西，人家第一节课就讲完了。可我哭是因为想起了我爸，我守着数他的呼吸，数到后来都忘了数到了哪儿。有的账是算不清的，能算的只有那些有纸、写着来路的，我爸那一摔，纸上写的是个人行为。'),
      n('结业的时候老师让写一篇东西，他写了好几页，题目是「父亲的呼吸怎么数」。老师问他这算档案吗，他说这是他唯一会做的归档。后来他在档城一家小档案馆找了份活儿，每天收件编号，再一份一份放进柜子里。'),
      s('eric','我现在改记账了，记还要等多久才能再递复核。还有，你从我手里借走的那张照片，什么时候还我？我快数完了，到时候你可别赖着。'),
      {if:S=>S.flags&&S.flags.route==='eric',then:[
        {p:'黑本子封底夹着那张照片。',c:[
          {t:'现在就还给他。',tone:'soft',tr:{eric:1},then:[
            n('我把照片从封底抽出来递给他。他接过去看了一会儿，揣进胸口的口袋里。'),
            s('eric','那我明天就去Q的铺子。这回是数完了的，我给他整张。')]},
          {t:'再替他收一阵。',tone:'cold',then:[
            n('他点点头，说那也行，在我这儿他放心。')]},
        ]}]}],
    leader:[{bg:'bg_warehouse'},
      n('团长合册以后还是差不多那个样子，只有一件事变了，他从里屋搬到了外屋。他把里头那张桌子搬出来，就摆在长桌旁边，上面放着那本册子和一摞纸。'),
      {show:'leader'},
      s('leader','在里面待了好些年了，也该出来了。我藏的东西现在写在一页纸上，谁都看得见，再关着门也没意思。'),
      n('他开始接活儿，只接拿回来的那种。东西被人拿走了，来路清楚，可走不了程序，人家找上门来求他。头半年接了几单，一分钱也没收，他说收了就是偷。'),
      n('这一年他学会了两件小事。头一件是记账，每一单的来龙去脉都写在本子上，连对方穿什么衣服都写，他说他被人写了一辈子，现在换他自己写。另一件是叫人的名字，团里的人他一个一个叫了过来，每回开口前都要停半拍。'),
      n('有一天夜里，长桌边只剩我们两个。他在灯底下写完字，合上册子。'),
      me('你现在能叫我的名字了吧？'),
      s('leader','能。'),
      n('他抬起头，张了好几回嘴。'),
      S=>[s('leader',(S.name||'你')+'。')],
      n('叫完了，屋里很静，听得见外面的风穿过巷子。过了很久他才又开口。'),
      s('leader','一个人要是很久没叫过别人的名字，就会忘了该怎么叫，我差一点就忘了。'),
      n('那天晚上他走到门口，替我拉开了门。'),
      s('leader','以后我来开门，我现在会了。')],
    jacob:[{bg:'bg3_alley'},
      n('这些人里，Jacob走得最远。他去了很远的地方，在一所大学念法律，一年回来两趟。'),
      {show:'jacob'},
      s('jacob','我这辈子最要紧的一件事，是让我父亲的名字进册，这件事办完了，我用不着再守着它。这一年我跟一大堆穿制服的人打过交道，发现规矩本身好懂，难的是让规矩对一个具体的人有用，我想学这个。'),
      n('头一趟回来是冬天，他带回来一张照片，学校图书馆的一个角落，桌上一本翻开的书。他说那是他坐的位置，靠窗，第二张桌子，我哪天真要去，就找那张桌子。'),
      n('第二趟是夏天，他人瘦了一圈，也晒黑了，笑得比以前多。那天晚上我们坐在门口，他把袖口往上撸了一下给我看，袖口底下空空的。'),
      s('jacob','头一个礼拜我老去摸，摸了个空，才想起来它在你那儿。后来有一天忘了摸，再后来发现，忘了也没事。'),
      me('那你现在站在哪一边？'),
      s('jacob','站在我自己这边。这话听着挺自私的，可我这辈子头一回听懂它。我做了大半辈子裴先生的儿子，现在做回我自己。'),
      n('我从口袋里把那枚徽章拿出来，放在他手心。他看了一眼，又合上我的手，把它推了回来。'),
      s('jacob','说了给你，就在你那儿。')],
  };
  return common_open.concat(body[key]||[n('（这一条还在装订。）')]).concat([
    n('（本篇完。十条平行，读其中一篇时，就当另外几篇也在别处发生。）'),
    {softEnd:1}
  ]);
}
LATER_WHO.forEach(([k,title,who])=>{
  E.EXTRAS['later_'+k]={id:'later_'+k,title:title,who,group:'后来的日子',lock:'通关第三章「合册」后解锁',
    check:()=>E.hasExtra('later')||E.hasExtra('later_'+k),
    steps:laterSteps(k,title)};
});
E.EXTRAS.later_epilogue={id:'later_epilogue',title:'一年以后',who:'全员',group:'后来的日子',lock:'通关第三章后解锁',

async function playExtra(ex){
  const t=E.$('#title'); if(t) t.classList.remove('on');
  E.unlockExtra(ex.id.startsWith('later_')?'later':ex.id);
  if(ex.id.startsWith('later_')) E.unlockExtra(ex.id);
  /* 构造临时章节状态，复用 run */
  const base=E.CHAPTERS.ch2||E.CHAPTERS.ch1||E.CHAPTERS[Object.keys(E.CHAPTERS)[0]];
  const S=E.newState(base.id); E.setS(S); E.setCH(base);
  try{
    const carry=JSON.parse(localStorage.getItem('touxin_carry_ch2')||localStorage.getItem('touxin_carry_mid')||'null');
    if(carry){ if(carry.name) S.name=carry.name; if(carry.trust) S.trust=carry.trust; if(carry.tone) S.tone=carry.tone; if(carry.flags) Object.assign(S.flags,carry.flags); }
  }catch(e){}
  E.$('#nav')&&E.$('#nav').classList.add('hide');
  const prevSoft=base.onSoftEnd;
  base.onSoftEnd=async()=>{ base.onSoftEnd=prevSoft; E.title(); E.openExtras&&setTimeout(()=>E.openExtras(),200); };
  try{ await E.run(ex.steps); }catch(e){ if(e!=='abort') console.error(e); }
  base.onSoftEnd=prevSoft;
}

E.playExtra=playExtra;
E.openExtras=function(){
  const w=E.el('div','');
  const groups={};
  Object.values(E.EXTRAS).forEach(ex=>{
    if(ex.play&&ex.id==='midyear'){ /* listed below */ }
    const g=ex.group||'其他'; (groups[g]=groups[g]||[]).push(ex);
  });
  const order=['章节之间','三个长夜','后来的日子','合册之后'];
  order.forEach(g=>{
    if(!groups[g]) return;
    w.appendChild(E.el('h4','',g));
    const cards=E.el('div','cards');
    groups[g].forEach(ex=>{
      const open=ex.check?ex.check():E.hasExtra(ex.id);
      const c=E.el('div','ecard'+(open?'':' used'),
        '<h4>'+(open?'《'+ex.title+'》':'未解锁')+'</h4><p>'+(ex.who||'')+(open?'':' · '+(ex.lock||'未解锁'))+'</p>');
      if(open) c.onclick=()=>{ E.sfx('click'); E.closePanel(); if(ex.play) ex.play(); else playExtra(ex); };
      cards.appendChild(c);
    });
    w.appendChild(cards);
  });
  w.appendChild(E.el('p','muted','《三个长夜》与《十二条线》同路，只是更长更慢。一周目只走一条的规矩仍在：解锁取决于你第二章走的那条支线。《后来的日子》与《余波》在合册之后解锁，十条平行，不互相覆盖。'));

  s('du','我每天夜里都在，库里值夜的就我一个人。可立册库的人只管添册，账是谁的我们不问，你问我看见了谁，我也只能这么答你。'),

  n('回程的电梯往上走，楼层灯一格一格地往上跳。对账人看着那排灯，说他查了这么多年档，头一回见有人给空白立规矩。'),

  {bg:'bg3_whitepage',show:'younghoon'},

  n('纸上慢慢浮出一层一层的影子，大多叠得太密，认不出来。中间偏下的地方有半行字比别处都深，那是被收回去的一笔。拓完以后，小杜把宣纸夹进了白页后面，说就放在这儿，你们下回来还能看。'),
  {bg:'bg2_noodle',show:'ji'},

  {bg:'bg3_roof',show:'sunwoo'},

  s('sunwoo','那就是我自己心里有动静。坐吧，这块地方我刚擦过，不收你钱。'),
  n('图纸上画的是一口钟的剖面，齿轮一个套着一个，旁边写满了小字。他说是他爸那口钟，凭记忆画了三年，每回画到中间都差一个齿轮，说着用笔尖点了点中间那个空着的圆。'),
  s('sunwoo','你那个本子现在写到第几本了？第一行还是那个侍应长吧。你这个人，欠谁一句话能记上三本。'),

  s('sunwoo','行，那就算咱俩扯平了。'),

 ],next:'c3'};
