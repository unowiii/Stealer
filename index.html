<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes"><title>偷心行动 · 完整版</title><style>:root{--gold:#c9a96a;--gold2:#e8d6a8;--ivory:#f3ead7;--ink:#1c2230;--ink2:#2a3244;--blue:#8fa6c4;--red:#9b2f2f;--glass:rgba(18,24,36,.72);--paper:#efe4cc;--paper2:#e2d3b2;
--serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;--sans:"PingFang SC","Noto Sans SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;--mono:"Courier New","SimSun",monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#05070b;overflow:hidden;font-family:var(--sans);color:var(--ivory);user-select:none;-webkit-user-select:none}
#wrap{position:fixed;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center}
#stage{position:absolute;left:50%;top:50%;margin:-360px 0 0 -640px;-webkit-flex-shrink:0;flex-shrink:0;width:1280px;height:720px;-webkit-transform-origin:50% 50%;transform-origin:50% 50%;overflow:hidden;background:#0b0f16;box-shadow:0 0 80px #000}
.layer{position:absolute;top:0;right:0;bottom:0;left:0}
/* backgrounds */
#bgA,#bgB{position:absolute;top:-2%;right:-2%;bottom:-2%;left:-2%;background-size:cover;background-position:center;opacity:0;transition:opacity 1.1s ease;animation:kb 40s ease-in-out infinite alternate}
#bgA.on,#bgB.on{opacity:1}
@keyframes kb{from{transform:scale(1.0) translate(0,0)}to{transform:scale(1.05) translate(-1%,-.6%)}}
#shade{background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(0,0,0,.55) 100%),linear-gradient(to bottom,rgba(5,8,14,.25),rgba(5,8,14,0) 25%,rgba(5,8,14,0) 60%,rgba(5,8,14,.55));pointer-events:none}
#grain{pointer-events:none;opacity:.10;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#fx{pointer-events:none}
/* characters */
.stand{position:absolute;bottom:196px;width:264px;height:352px;opacity:0;transition:opacity .4s,transform .4s,filter .4s;filter:brightness(.55) saturate(.7);pointer-events:none}
.stand.l{left:56px;transform:translateY(16px)}.stand.r{right:56px;transform:translateY(16px)}
.stand.on{opacity:1;transform:none}.stand.talk{filter:none;transform:translateY(-6px)}
.plate{position:absolute;top:0;right:0;bottom:0;left:0;border-radius:10px;background:linear-gradient(170deg,rgba(26,32,48,.94),rgba(10,13,22,.96));border:1px solid rgba(201,169,106,.65);box-shadow:0 0 0 4px rgba(10,13,22,.55),0 0 0 5px rgba(201,169,106,.22),0 14px 40px rgba(0,0,0,.6);display:flex;flex-direction:column;align-items:center;padding:22px 14px 14px;overflow:hidden}
.plate:before{content:"";position:absolute;top:0;right:0;bottom:0;left:0;background:radial-gradient(circle at 50% 36%,var(--c) 0%,transparent 62%);opacity:.28}
.plate .med{position:relative;width:150px;height:150px;border-radius:50%;border:2px solid var(--c);box-shadow:0 0 0 6px rgba(0,0,0,.35),0 0 0 7px rgba(201,169,106,.4),inset 0 0 30px rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 40% 35%,rgba(255,255,255,.08),rgba(0,0,0,.35))}
.plate .med svg{width:92px;height:92px;stroke:var(--c);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.plate .pn{position:relative;margin-top:18px;font-family:var(--serif);font-size:24px;letter-spacing:5px;color:var(--ivory)}
.plate .pc{position:relative;margin-top:4px;font-size:12px;letter-spacing:3px;color:var(--c)}
.plate .pl{position:relative;margin-top:10px;width:70%;height:1px;background:linear-gradient(90deg,transparent,var(--c),transparent)}
.mcard .med2{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);width:120px;height:120px;border-radius:50%;border:2px solid var(--c);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 6px rgba(0,0,0,.3),0 0 0 7px rgba(201,169,106,.35)}
.mcard .med2 svg{width:74px;height:74px;stroke:var(--c);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.stand .pcard{position:absolute;top:0;right:0;bottom:0;left:0}
.pcard{border-radius:8px;overflow:hidden;background:#0b0f16;box-shadow:0 14px 40px rgba(0,0,0,.65),0 0 0 4px rgba(10,13,22,.6),0 0 0 5px var(--c)}
.pcard .pimg{position:absolute;top:0;right:0;bottom:0;left:0;background-size:cover;background-position:center 20%}
.pcard:after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;background:linear-gradient(to bottom,transparent 55%,rgba(6,9,15,.92)),radial-gradient(circle at 50% 120%,var(--c),transparent 60%);opacity:.95}
.pcard .pfr{position:absolute;top:7px;right:7px;bottom:7px;left:7px;border:1px solid rgba(241,226,184,.75);border-radius:4px;z-index:2}
.pcard .pfr:before,.pcard .pfr:after{content:"";position:absolute;width:22px;height:22px;border:2px solid #f1e2b8}
.pcard .pfr:before{left:-4px;top:-4px;border-right:none;border-bottom:none}.pcard .pfr:after{right:-4px;bottom:-4px;border-left:none;border-top:none}
.pcard .emb{position:absolute;right:14px;top:14px;z-index:3;width:46px;height:46px;border-radius:50%;background:rgba(8,11,18,.82);border:1.5px solid var(--c);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px rgba(0,0,0,.35)}
.pcard .emb svg,.mcard .emb2 svg,#av.ic svg{width:30px;height:30px;stroke:var(--c);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.pcard .pname{position:absolute;left:0;right:0;bottom:14px;z-index:3;text-align:center;font-family:var(--serif)}
.pcard .pname b{display:block;font-size:24px;letter-spacing:5px;font-weight:400;color:var(--ivory);text-shadow:0 2px 8px #000}
.pcard .pname small{display:block;margin-top:2px;font-size:11px;letter-spacing:3px;color:var(--c)}
.mcard .emb2{position:absolute;right:10px;top:34px;z-index:3;width:40px;height:40px;border-radius:50%;background:rgba(8,11,18,.8);border:1.5px solid var(--c);display:flex;align-items:center;justify-content:center}
.mcard .emb2 svg{width:26px;height:26px}
#av{position:absolute;left:-36px;top:-46px;width:84px;height:84px;border-radius:50%;background-size:180%;border:2px solid var(--c);box-shadow:0 0 0 4px rgba(10,13,22,.8),0 0 0 5px rgba(241,226,184,.6),0 6px 18px rgba(0,0,0,.6);display:none;z-index:2;background-color:#0b0f16;align-items:center;justify-content:center}
#av.on{display:flex}
#dlg.hasav #nm{left:60px}
/* top bar */
#top{position:absolute;left:0;right:0;top:0;height:56px;display:flex;align-items:center;padding:0 18px;gap:14px;z-index:30;background:linear-gradient(to bottom,rgba(6,9,15,.85),rgba(6,9,15,0));pointer-events:none}
#top>*{pointer-events:auto}
.daybadge{display:flex;align-items:center;gap:10px;padding:6px 16px 6px 8px;border:1px solid rgba(201,169,106,.55);border-radius:22px;background:var(--glass);backdrop-filter:blur(6px);font-family:var(--serif);letter-spacing:2px}
.daybadge svg{width:30px;height:30px}
.daybadge b{color:var(--gold2);font-size:17px}.daybadge span{font-size:13px;color:#c8cfdb}
.pill{padding:6px 12px;border:1px solid rgba(201,169,106,.35);border-radius:16px;background:var(--glass);font-size:13px;color:#d8dde6;display:flex;gap:6px;align-items:center}
.pill i{font-style:normal;color:var(--gold2);font-weight:600}
.ap{display:flex;gap:4px}.ap u{width:10px;height:10px;border-radius:50%;border:1px solid var(--gold);display:inline-block}.ap u.f{background:var(--gold)}
#top .sp{flex:1}
.ib{width:40px;height:40px;border-radius:50%;border:1px solid rgba(201,169,106,.55);background:var(--glass);color:var(--gold2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;font-family:var(--serif);transition:.2s}
.ib:hover{background:rgba(201,169,106,.18);transform:translateY(-1px)}
/* nav */
#nav{position:absolute;right:16px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;z-index:25;transition:opacity .3s}
#nav.hide{opacity:0;pointer-events:none}
.nb{width:86px;height:74px;border-radius:12px;background:linear-gradient(160deg,rgba(30,38,56,.85),rgba(12,16,26,.88));border:1px solid rgba(201,169,106,.5);box-shadow:inset 0 0 0 3px rgba(0,0,0,.25),0 4px 14px rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;color:var(--ivory);font-family:var(--serif);font-size:14px;letter-spacing:2px;position:relative;transition:.2s}
.nb:hover{border-color:var(--gold2);transform:translateX(-3px)}
.nb svg{width:26px;height:26px;stroke:var(--gold2);fill:none;stroke-width:1.5}
.nb .dot{position:absolute;top:6px;right:8px;width:8px;height:8px;border-radius:50%;background:#d9564a;display:none}.nb.new .dot{display:block}
/* dialogue */
#dlg{position:absolute;left:150px;right:150px;bottom:22px;min-height:150px;z-index:40;padding:28px 40px 22px;border-radius:6px;cursor:pointer;display:none;
background:linear-gradient(180deg,rgba(14,19,30,.80),rgba(10,13,22,.92));border:1px solid rgba(201,169,106,.55);box-shadow:0 0 0 4px rgba(10,13,22,.5),0 0 0 5px rgba(201,169,106,.25),0 10px 40px rgba(0,0,0,.6);backdrop-filter:blur(6px)}
#dlg:before,#dlg:after{content:"";position:absolute;width:26px;height:26px;border:2px solid var(--gold);}
#dlg:before{left:-3px;top:-3px;border-right:none;border-bottom:none}#dlg:after{right:-3px;bottom:-3px;border-left:none;border-top:none}
#dlg.on{display:block;animation:up .3s ease}
@keyframes up{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
#nm{position:absolute;top:-18px;left:30px;padding:4px 22px;font-family:var(--serif);font-size:18px;letter-spacing:3px;color:#1a1a1a;background:linear-gradient(90deg,var(--gold),var(--gold2),var(--gold));clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,8px 100%,0 50%);display:none}
#nm.on{display:block}
#tx{font-family:var(--serif);font-size:21px;line-height:1.8;color:#eef0f4;letter-spacing:.5px;min-height:76px;white-space:pre-wrap}
#tx.inner{color:#b8c6dc;font-style:italic}
#tx.radio{color:#9fe0b8;font-family:var(--mono);letter-spacing:2px}
#tx.narr{color:#e3e0d6}
#more{position:absolute;right:22px;bottom:12px;width:0;height:0;border:7px solid transparent;border-top:9px solid var(--gold2);animation:bob 1s infinite}
@keyframes bob{50%{transform:translateY(4px)}}
.dlgtools{position:absolute;right:16px;top:-30px;display:flex;gap:6px}
.dlgtools button{font-size:12px;padding:3px 10px;border-radius:10px;border:1px solid rgba(201,169,106,.4);background:var(--glass);color:#d8dde6;cursor:pointer}
.dlgtools button.on{background:rgba(201,169,106,.35);color:#fff}
/* radio badge */
#radioFx{position:absolute;left:24px;bottom:200px;z-index:41;display:none;align-items:center;gap:8px;padding:6px 14px;border-radius:14px;background:rgba(10,30,22,.75);border:1px solid #4f9a74;color:#9fe0b8;font-family:var(--mono);font-size:13px}
#radioFx.on{display:flex}#radioFx b{width:8px;height:8px;border-radius:50%;background:#7fe0a8;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
/* choices */
#choices{position:absolute;top:0;right:0;bottom:0;left:0;z-index:45;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(4,6,10,.35)}
#choices.on{display:flex}
#choices .prompt{font-family:var(--serif);color:var(--gold2);font-size:18px;letter-spacing:3px;margin-bottom:6px;text-shadow:0 2px 8px #000}
.ch{min-width:520px;max-width:760px;padding:14px 34px;font-family:var(--serif);font-size:19px;color:#f3ead7;text-align:center;cursor:pointer;position:relative;
background:linear-gradient(90deg,rgba(12,16,26,0),rgba(18,24,38,.92) 12%,rgba(18,24,38,.92) 88%,rgba(12,16,26,0));border-top:1px solid rgba(201,169,106,.5);border-bottom:1px solid rgba(201,169,106,.5);transition:.2s;animation:fadein .35s both}
.ch:hover{background:linear-gradient(90deg,rgba(12,16,26,0),rgba(70,56,30,.9) 12%,rgba(70,56,30,.9) 88%,rgba(12,16,26,0));transform:scale(1.02)}
.ch .tone{display:inline-block;vertical-align:middle;margin-right:12px;position:relative;top:-2px;font-size:11px;letter-spacing:1px;padding:1px 6px;border-radius:8px;border:1px solid}
.tone.cold{color:#9fc0e8;border-color:#6f8fb8}.tone.sharp{color:#e8a49f;border-color:#b86f6f}.tone.soft{color:#e8d49f;border-color:#b8a46f}
.ch.dis{opacity:.4;pointer-events:none}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* title card */
#card{position:absolute;top:0;right:0;bottom:0;left:0;z-index:60;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(3,5,9,.86);gap:12px}
#card.on{display:flex;animation:fadein .6s}
#card h2{font-family:var(--serif);font-weight:400;font-size:44px;letter-spacing:12px;margin:0;color:var(--ivory)}
#card p{font-family:var(--serif);color:var(--gold2);letter-spacing:6px;margin:0;font-size:16px}
#card .ln{width:280px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
/* toast */
#toast{position:absolute;top:70px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.tt{padding:9px 22px;border-radius:4px;background:linear-gradient(90deg,rgba(40,32,16,.0),rgba(40,32,16,.92) 15%,rgba(40,32,16,.92) 85%,rgba(40,32,16,0));color:var(--gold2);font-family:var(--serif);letter-spacing:2px;font-size:15px;animation:tt 2.8s forwards}
@keyframes tt{0%{opacity:0;transform:translateY(-8px)}10%,80%{opacity:1;transform:none}100%{opacity:0}}
/* hotspots */
#hots{z-index:20}
.hs{position:absolute;cursor:pointer;border-radius:8px}
.hs .lb{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);white-space:nowrap;padding:5px 12px;border-radius:14px;background:rgba(10,14,22,.78);border:1px solid rgba(201,169,106,.7);color:var(--gold2);font-family:var(--serif);font-size:14px;letter-spacing:1px;transition:.2s;display:flex;gap:6px;align-items:center}
.hs .lb:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gold2);box-shadow:0 0 0 0 rgba(232,214,168,.7);animation:pulse 1.8s infinite}
.hs.done .lb{opacity:.55}.hs.done .lb:before{animation:none;background:#777}
.hs:hover .lb{background:rgba(70,56,30,.9);transform:translate(-50%,-50%) scale(1.06)}
@keyframes pulse{70%{box-shadow:0 0 0 10px rgba(232,214,168,0)}100%{box-shadow:0 0 0 0 rgba(232,214,168,0)}}
.locbar{position:absolute;left:24px;top:70px;z-index:22;display:flex;flex-direction:column;gap:6px}
.loctitle{font-family:var(--serif);font-size:28px;letter-spacing:6px;color:var(--ivory);text-shadow:0 2px 10px #000}
.locsub{font-size:13px;color:#b9c2d0;letter-spacing:1px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 26px;font-family:var(--serif);font-size:17px;letter-spacing:3px;color:#1b1b1b;cursor:pointer;border:none;
background:linear-gradient(180deg,#f1e2b8,#c9a96a);clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,10px 100%,0 50%);transition:.2s}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:linear-gradient(180deg,rgba(40,48,66,.95),rgba(20,26,38,.95));color:var(--gold2);box-shadow:inset 0 0 0 1px var(--gold)}
.btn.sm{padding:6px 16px;font-size:14px}
.btn[disabled]{opacity:.4;pointer-events:none}
#hubbar{position:absolute;left:24px;bottom:24px;z-index:24;display:flex;gap:12px}
/* modal */
#modal{position:absolute;top:0;right:0;bottom:0;left:0;z-index:85;display:none;background:rgba(4,6,10,.6);backdrop-filter:blur(3px)}
#modal.on{display:block;animation:fadein .25s}
.panel{position:absolute;left:60px;right:60px;top:40px;bottom:40px;border-radius:8px;background:linear-gradient(180deg,rgba(22,28,42,.96),rgba(12,16,26,.97));border:1px solid rgba(201,169,106,.6);box-shadow:0 0 0 5px rgba(12,16,26,.6),0 0 0 6px rgba(201,169,106,.25),0 20px 60px #000;display:flex;flex-direction:column;overflow:hidden}
.panel.paper{background:linear-gradient(180deg,#2a2419,#1b170f)}
.ph{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid rgba(201,169,106,.3);background:linear-gradient(90deg,rgba(201,169,106,.12),transparent)}
.ph h3{margin:0;font-family:var(--serif);font-weight:400;font-size:24px;letter-spacing:6px;color:var(--gold2)}
.ph .sp{flex:1}.ph .tabs{display:flex;gap:6px}
.tab{padding:6px 16px;border-radius:14px;border:1px solid rgba(201,169,106,.4);font-family:var(--serif);font-size:14px;color:#cfd5df;cursor:pointer;letter-spacing:2px}
.tab.on{background:rgba(201,169,106,.3);color:#fff}
.pb{flex:1;overflow:auto;padding:18px 22px;position:relative}
.pb::-webkit-scrollbar{width:8px}.pb::-webkit-scrollbar-thumb{background:rgba(201,169,106,.35);border-radius:4px}
.x{width:36px;height:36px;border-radius:50%;border:1px solid var(--gold);background:none;color:var(--gold2);font-size:18px;cursor:pointer}
/* evidence cards */
.cards{display:flex;flex-wrap:wrap;gap:12px}
.ecard{width:176px;min-height:118px;padding:10px 12px;border-radius:4px;background:linear-gradient(180deg,var(--paper),var(--paper2));color:#2b2418;font-family:var(--serif);position:relative;cursor:grab;box-shadow:0 3px 10px rgba(0,0,0,.5);transition:transform .15s;touch-action:none}
.ecard:hover{transform:translateY(-2px) rotate(-.5deg)}
.ecard h4{margin:0 0 6px;font-size:15px;letter-spacing:1px;border-bottom:1px dashed #9b8a66;padding-bottom:4px}
.ecard p{margin:0;font-size:12px;line-height:1.5;color:#4a3e2a}
.ecard .tag{position:absolute;right:6px;top:-8px;font-size:11px;padding:1px 6px;background:var(--red);color:#fff;border-radius:3px;font-family:var(--sans)}
.ecard.sel{outline:3px solid #e2b34d}
.ecard.ded{background:linear-gradient(180deg,#e8eef7,#cfd9e8)}
.ecard.used{opacity:.45}
.chain{display:flex;gap:10px;align-items:stretch;flex-wrap:nowrap;padding:8px 2px 14px;overflow-x:auto}
.slot{flex:0 0 160px;min-height:190px;border:1.5px dashed rgba(201,169,106,.6);border-radius:6px;padding:8px;display:flex;flex-direction:column;gap:6px;position:relative;background:rgba(201,169,106,.05)}
.slot .sl{font-family:var(--serif);color:var(--gold2);font-size:14px;letter-spacing:1px}
.slot .sq{font-size:12px;color:#aab3c2;line-height:1.5}
.slot.ok{border-style:solid;border-color:#9fd3a8;background:rgba(120,200,140,.08)}
.slot.hover{background:rgba(201,169,106,.2)}
.slot .ecard{width:auto;min-height:0;cursor:pointer}
.arrow{align-self:center;color:var(--gold);font-size:22px}
/* inspect */
.insp{display:flex;gap:18px;height:100%}
.docwrap{flex:1;position:relative;display:flex;align-items:flex-start;justify-content:center;gap:20px;overflow:auto;padding:6px}
.doc{position:relative;width:440px;min-height:520px;padding:30px 34px;background:var(--paper);color:#2b2418;font-family:var(--serif);box-shadow:0 8px 30px rgba(0,0,0,.6);background-image:linear-gradient(rgba(120,90,40,.06) 1px,transparent 1px);background-size:100% 28px;cursor:zoom-in;flex:0 0 auto}
.doc.sm{width:380px}
.doc h5{margin:0 0 10px;text-align:center;font-size:20px;letter-spacing:6px}
.doc .ty{font-family:var(--mono);font-size:14px;line-height:1.9}
.doc table{width:100%;border-collapse:collapse;font-size:13px}.doc td,.doc th{border:1px solid #8a7a5a;padding:4px 6px;height:30px}
.doc .hsx{position:absolute;border-radius:4px;cursor:pointer}
.doc .hsx.found{outline:2px solid rgba(155,47,47,.75);background:rgba(155,47,47,.08)}
.doc .hsx.hint{animation:hint 1.2s infinite}
@keyframes hint{50%{background:rgba(226,179,77,.35)}}
.doc .hsx.pick{outline:2px dashed #2a5ea8;background:rgba(42,94,168,.12)}

/* ---------- 声音（Web Audio，全部现场合成） ---------- */
const AU={ctx:null};
function audioInit(){
  if(AU.ctx) return; try{AU.ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  const c=AU.ctx; AU.master=c.createGain(); AU.master.connect(c.destination);
  AU.amb=c.createGain(); AU.amb.connect(AU.master); AU.sfx=c.createGain(); AU.sfx.connect(AU.master);
  const len=c.sampleRate*4, b=c.createBuffer(2,len,c.sampleRate);
  for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);let last=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;last=(last+0.02*w)/1.02;d[i]=last*3.2+w*0.04;}}
  AU.noise=b;
  const src=c.createBufferSource(); src.buffer=b; src.loop=true;
  const lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1400;
  const hp=c.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=180;
  AU.rainG=c.createGain(); AU.rainG.gain.value=0;
  src.connect(hp); hp.connect(lp); lp.connect(AU.rainG); AU.rainG.connect(AU.amb); src.start();
  /* 低沉的室内底噪 */
  const o=c.createOscillator(); o.type='sine'; o.frequency.value=55; AU.humG=c.createGain(); AU.humG.gain.value=0; o.connect(AU.humG); AU.humG.connect(AU.amb); o.start();
  applyVol();
}
function applyVol(){ if(!AU.ctx) return; AU.master.gain.value=META.settings.vol; AU.amb.gain.value=META.settings.amb; }
E.applyVol=applyVol;
function setAmb(kind){
  S&&(S.amb=kind);
  if(!AU.ctx) return; const t=AU.ctx.currentTime;
  let rain={rain:.55,lightrain:.28,indoor:.12,none:0,quiet:0,archive:.05}[kind]; if(rain==null) rain=.2;
  let hum={indoor:.02,quiet:.015,rain:0,lightrain:.01,none:0,archive:.012}[kind]; if(hum==null) hum=0;
  AU.rainG.gain.linearRampToValueAtTime(rain,t+1.5); AU.humG.gain.linearRampToValueAtTime(hum,t+1.5);
  clearInterval(AU.tickT); if(kind==='indoor'||kind==='quiet'||kind==='archive') AU.tickT=setInterval(()=>sfx('tick'),1000);
  if(E.AMB_EXT) try{E.AMB_EXT(kind,AU);}catch(e){}
}
function sfx(n){
  if(!AU.ctx) return; const c=AU.ctx,t=c.currentTime;
  if(E.SFX_EXT&&E.SFX_EXT[n]){ try{E.SFX_EXT[n](c,t,AU);}catch(e){} return; }
  const g=c.createGain(); g.connect(AU.sfx);
  if(n==='click'||n==='tick'||n==='soft'){
    const o=c.createOscillator(); o.type='sine'; o.frequency.value=n==='tick'?1800:n==='soft'?520:880;
    const v=n==='tick'?.035:.08; g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+(n==='tick'?.03:.09));
    o.connect(g); o.start(t); o.stop(t+.12);
  } else if(n==='paper'||n==='stamp'){
    const s=c.createBufferSource(); s.buffer=AU.noise; const f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=n==='paper'?3200:300; f.Q.value=.8;
    const d=n==='paper'?.32:.12; g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(n==='paper'?.35:.9,t+.03); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    s.connect(f); f.connect(g); s.start(t,Math.random()*2,d+.05);
  } else if(n==='chime'||n==='good'){
    [660,990].forEach((fq,i)=>{const o=c.createOscillator(),gg=c.createGain();o.type='triangle';o.frequency.value=fq;gg.gain.setValueAtTime(.0001,t+i*.09);gg.gain.linearRampToValueAtTime(.07,t+i*.09+.02);gg.gain.exponentialRampToValueAtTime(.0001,t+i*.09+.8);o.connect(gg);gg.connect(AU.sfx);o.start(t+i*.09);o.stop(t+i*.09+.9);});
  } else if(n==='bad'){
    const o=c.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(300,t); o.frequency.linearRampToValueAtTime(200,t+.25);
    g.gain.setValueAtTime(.07,t); g.gain.exponentialRampToValueAtTime(.0001,t+.3); o.connect(g); o.start(t); o.stop(t+.32);
  } else if(n==='radio'){
    const s=c.createBufferSource(); s.buffer=AU.noise; const f=c.createBiquadFilter(); f.type='highpass'; f.frequency.value=2500;
    g.gain.setValueAtTime(.12,t); g.gain.exponentialRampToValueAtTime(.0001,t+.35); s.connect(f); f.connect(g); s.start(t,Math.random()*2,.4);
  } else if(n==='hum'){
    const o=c.createOscillator(); o.type='sine'; o.frequency.value=70; g.gain.setValueAtTime(.12,t); g.gain.exponentialRampToValueAtTime(.0001,t+2.2); o.connect(g); o.start(t); o.stop(t+2.3);
  }
}

let selCard=null;
function dragify(card,slots,b){
  const tryDrop=(slotId)=>{
    const s=CH.chain.slots.find(z=>z.id===slotId); const id=card.dataset.id;
    if(s.accept===id){ S.chain[slotId]=id; sfx('stamp'); toast('「'+s.label+'」这一环接上了'); if(CH.chain.slots.every(z=>S.chain[z.id])){ sfx('good'); S.flags.chainDone=1; }
      b.innerHTML=''; renderChain(b); }
    else { S.chainMiss++; sfx('bad'); toast(s.no||'这张纸说的不是这一环。'); }
  };
  card.addEventListener('click',e=>{ if(card._dragged) return; $$('.ecard.sel').forEach(z=>z.classList.remove('sel')); selCard=card; card.classList.add('sel'); });
  Object.entries(slots).forEach(([sid,sl])=>{ if(sl._bound) return; sl._bound=1; sl.addEventListener('click',()=>{ if(selCard&&!S.chain[sid]&&document.body.contains(selCard)){ const c=selCard; selCard=null; c.classList.remove('sel'); card=c; tryDrop(sid);} }); });
  card.addEventListener('pointerdown',e=>{
    if(e.button>0) return; card._dragged=false; const sx=e.clientX,sy=e.clientY; let ghost=null;
    const mv=ev=>{ const dx=ev.clientX-sx,dy=ev.clientY-sy; if(!ghost&&Math.hypot(dx,dy)>8){ ghost=card.cloneNode(true); ghost.style.cssText='position:fixed;z-index:999;pointer-events:none;width:170px;opacity:.9;transform:rotate(-3deg)'; document.body.appendChild(ghost); card._dragged=true; }
      if(ghost){ ghost.style.left=(ev.clientX-80)+'px'; ghost.style.top=(ev.clientY-30)+'px'; Object.values(slots).forEach(s=>{const r=s.getBoundingClientRect(); s.classList.toggle('hover',ev.clientX>r.left&&ev.clientX<r.right&&ev.clientY>r.top&&ev.clientY<r.bottom);}); } };
    const up=ev=>{ document.removeEventListener('pointermove',mv); document.removeEventListener('pointerup',up);
      if(ghost){ ghost.remove(); let hit=null; Object.entries(slots).forEach(([k,s])=>{const r=s.getBoundingClientRect(); s.classList.remove('hover'); if(ev.clientX>r.left&&ev.clientX<r.right&&ev.clientY>r.top&&ev.clientY<r.bottom) hit=k;}); if(hit&&!S.chain[hit]){ const keep=card; selCard=null; card=keep; tryDrop(hit);} setTimeout(()=>card._dragged=false,30); } };
    document.addEventListener('pointermove',mv); document.addEventListener('pointerup',up);
  });
}

/* ---------- 剧本执行 ---------- */
let RUN=0;
async function run(steps){
  const my=RUN;
  for(const st of steps){
    if(my!==RUN) throw 'abort';
    if(typeof st==='function'){ const r=await st(S,E); if(Array.isArray(r)) await run(r); continue; }
    if(st.if!==undefined){ const ok=typeof st.if==='function'?st.if(S,E):!!S.flags[st.if]; await run(ok?(st.then||[]):(st.else||[])); continue; }
    if(st.bg!==undefined){ setBg(st.bg,st.fx); if(st.clear!==false) clearChars(); await sleep(st.wait!=null?st.wait:350); }
    if(st.card){ hideDlg(); clearChars(); await titleCard(st.card,st.sub); }
    if(st.set) Object.assign(S.flags,st.set);
    if(st.tr) addTrust(st.tr);
    if(st.ev) addEv(st.ev);
    if(st.sfx) sfx(st.sfx);
    if(st.amb) setAmb(st.amb);
    if(st.show) showChar(st.show,st.side);
    if(st.hide) clearChars();
    if(st.n!=null) await say(null,st.n,'narr');
    if(st.i!=null) await say(null,st.i,'inner');
    if(st.me!=null) await say('me',st.me);
    if(st.s) await say(st.s,st.t);
    if(st.radio!=null) await say(null,st.radio,'radio');
    if(st.tv){ const v=st.tv[tone()]||st.tv.cold; await say(st.who||'me',v,st.who?undefined:undefined); }
    if(st.ti){ const v=st.ti[tone()]||st.ti.cold; await say(null,v,'inner'); }
    if(st.c){ hideDlg(); const i=await choose(st.p,st.c.filter(o=>!o.if||o.if(S))); const o=st.c.filter(o=>!o.if||o.if(S))[i];
      if(o.tone) S.tone[o.tone]+=(o.w||1); if(o.tr) addTrust(o.tr); if(o.set) Object.assign(S.flags,o.set); if(o.do) o.do(S,E);
      if(o.then) await run(o.then); }
    if(st.mini){ hideDlg(); const r=await E.MINI[st.mini](st.arg||{}); S.stats.mg[st.mini+(st.arg&&st.arg.id?'_'+st.arg.id:'')]=r; if(st.then) await run(st.then(r)||[]); }
    if(st.inspect){ hideDlg(); await inspect(st.inspect); }
    if(st.board!=null){ hideDlg(); await openBoard(st.board); }
    if(st.wait) await sleep(st.wait);
    if(st.end){ hideDlg(); await E.ending(); return; }
    if(st.softEnd){ hideDlg(); if(st.unlock) E.unlockExtra(st.unlock); if(CH.onSoftEnd) try{ await CH.onSoftEnd(S,st);}catch(e){ if(e!=='abort') console.error(e);} else if(CH.next) E.nextChapter(); else E.title(); throw 'abort'; }
  }
}

  S.phase=id; S.inHub=false; const ph=CH.phases[id]; $('#nav').classList.add('hide'); $('#hubbar').innerHTML=''; $('#hots').innerHTML=''; $('#locbar').innerHTML='';

  n('离门最近的是昨晚给我开门的大个子，叫Juyeon。他进门后背对着所有人把门锁摸了一遍，又低头看了眼门缝，才走回来坐下。别人讲计划，他听得很慢，常常隔两三句才「嗯」一声。可一整晚，他的视线隔一阵就往门那边去一次。'),
  n('还有一个人，袖口别着一枚铜徽章。它别反了，是美术馆的馆徽，字朝里，背面朝外。他说话轻，偶尔夹一两个英文词，替最小的那个孩子把外套从椅背上捡起来挂好，动作顺手得很。他们叫他Jacob。'),
  n('被他捡外套的那个叫Eric，坐下前先冲每个人笑一下，好像笑是他进门要交的东西。他说话很快，一件事讲好几遍，讲到后来自己先乐了。可他坐着的时候嘴唇偶尔会动一动，没出声，嘴里默默数着什么。'),
  n('剩下两个，一个是Younghoon，个子很高，几乎不说话，一直在本子上画人的侧脸，画完一张撕下来折好，放进口袋，从来不给人看。一个叫Q，手指细长，玩着一截红色的蜡棒，揉软了，捏成一个小方块，再揉软。'),
  i('一屋子人，代号念出来全是外文名。屿城是通商口岸，户籍册上允许登记外文名，所以这座城里一半人有两个名字。在这里，用哪个名字办事，本身就是一种手续。'),
  n('散会前我去饮水机接水，路过白板背后，听见两个人压着嗓子说话。'),

window.__BIOS={"me": {"title": "第四十一件", "html": "<p>祖父吹玻璃的时候不许人说话。</p><p>工作台在院子里那间棚屋，铁皮顶，夏天能把人蒸熟。他把吹管搭在铁架上转，转一圈，往炉口里送一下，脸被火烤得通红，汗顺着眉毛往下滴，一滴都不擦。我十岁以后就被准许站在门口看，条件是不出声，不进门槛。</p><p>第四十一件，他吹了三个礼拜。</p><p>那年他七十六岁，手已经开始抖了。拿筷子抖，签字抖，只有拿吹管的时候不抖。他说吹管有分量，压得住。可那一天他吹到左心房，手腕忽然一跳，炉里的火舌舔上去，玻璃上「嗤」地开了一道缝。</p><p>他停下来，把那颗心举到眼前看了很久。</p><p>「砸了吧。」我说。那年我十九岁，已经敢在棚屋里说话了。</p><p>「砸什么。」他把它放进退火炉，关上炉门，「裂是它自己长的。」</p><p>三天后他从退火炉里把它取出来，用一根钢针在底座侧面刻了两个数：41。刻完他把钢针往台子上一扔，说以后不吹了。</p><p>他确实没再吹过。</p><p>我后来常想，他那天说「不吹了」，是因为手，还是因为别的。棚屋的炉子早就该修了，炉膛裂了好几处，烧起来漏风。修一次要四万块。那年春天，有个穿夹克的年轻人来过两回，说他们公司专做手艺人的小额贷款，利息低，手续简单。祖父借了一万二，修了半个炉膛。</p><p>借据我见过，就压在工作台的抽屉里。一万二，祖父签的名，字抖得厉害，最后一笔拉得很长。</p><p>他走的那年冬天，来了两个男人，带着一份「抵债文书」。上面写着借款四十万，到期未还，以作品若干抵偿。清单第一项：玻璃心脏一件，编号41。</p><p>「这不是他的字。」我说。</p><p>那份文书上的签名一点都不抖，笔画干净利落，最后一笔收得很短。</p><p>「章是真的，」其中一个男人很客气，「公证处的章。您有异议，可以走法律程序。」</p><p>我去了。我跑了一年半，找过四个律师。前三个看完文书就摇头。第四个是个刚执业的年轻女律师，看了很久，说签名确实可疑，可鉴定笔迹要原件，原件在对方手里，对方说已经随作品转让了。她又说，借据上那一万二是真的，对方要是把这一万二拿出来，法官会觉得你们家本来就欠钱。</p><p>「他借了，」我说，「可他没借那么多。」</p><p>「我知道。」她说，「可在纸上，『借了』和『没借那么多』之间，隔着很远。」</p><p>我没钱再请她了。她送我到电梯口，电梯门开了又关，她按住了，说：「我信你。可我信没用，得让纸信。」</p><p>那天回家的公交上，我把那份抵债文书的复印件从头翻到尾，第一次注意到右下角有一栏「经手人」，签着一个我从没听过的名字。祖父的借据上也有这一栏，签的是那个穿夹克的年轻人。我把两个名字都抄在了车票背面。</p><p>从那天起我开始抄。转让记录、借展公告、公证公示，每一份上面的经手人，我都抄。我不信任何一份记录，可我信得过抄下来的那一刻，那一刻这个名字确实在那张纸上。</p><p>后来我学会了一件事：所有纸上的东西都有来路，每一道来路都有一个能钻进去的口子。我在一家拍卖行做过半年前台，在一家档案公司做过一年录入，把转让、借展、公证、认领这几种手续翻得滚瓜烂熟。我在每一份公开的转让记录里找那颗心脏。它转了三次手，每转一次就离我远一点，也离它自己的来路远一点。</p><p>三个月前，屿城美术馆门口的橱窗里贴出了借展预告。</p><p>我在橱窗前站了十分钟。照片拍得很好，灯光从上面打下来，那道裂泛着光。展签写着：借展，出处不明。</p><p>橱窗边上有一张小桌，桌上摆着一本观众留言簿，前面几页写的都是「期待」「好美」。我拿起拴在桌上的那支圆珠笔，写了一行：</p><p>写完我把笔放回去，走了。</p><p>我不知道那十分钟里有人在对面街角按了快门。我也不知道第二天，留言簿上那一页就被人照规定取了下来，存了档。</p><p>又过了两个多月，一个戴着铜徽章的男人在地铁站口叫住了我。他说话很轻，句子里偶尔夹一个英文词。他手里拿着一张照片，是我站在橱窗前的背影。</p><p>「有人让我找你。」他说，「他说，你写的那句话，他也想问问，你打算怎么拿回来？」</p><p>我看着他袖口那枚别反了的徽章。</p><p>「我不知道。」我说，「但我知道它现在挂在哪儿。」</p><p>他点点头，从口袋里抽出一张便签，写了一个地址，一个时间。</p><p>「明晚。」他说，「有人会问你为什么。你就照刚才那样答。」</p><p>那天晚上下雨。我没带伞出门，在便利店买了一把，走到仓库门口时伞骨折了一根。门开了一条缝，里面的人从头到脚看了我一遍。</p><p>我那时候想，祖父要是还在，一定会让我先把伞收好再进门。</p>"}, "leader": {"title": "三千块", "html": "<p>福利院的饭是四点半开。</p><p>十六岁的男孩一般吃不饱，他也一样。每个礼拜四是个例外：巷口大排档的陈姨会推着一辆三轮车过来，车斗里两只铝桶，一桶炒饭，一桶汤，说是「剩的」，其实是专门多做的。院里的孩子排成一队，他永远排在最后，因为排最后可以多刮一勺锅底。</p><p>那个礼拜四，排在他前面的小孩发烧了，烧了四天，院里的阿姨说要去大医院，大医院要押金。</p><p>那天晚上，一个穿灰西装的男人在院门口等他。</p><p>男人说话很和气，三十多岁，戴一副细边眼镜，手指上有墨水渍。他说自己姓裴，说有个手续上的事情，需要一个「年纪轻、没有家里人的」孩子帮忙签个字。</p><p>「签什么？」</p><p>「一张认领表。」裴先生说，「一件老东西，原来的主人家没人了，总得有个名字接着。你签了，东西走手续，跟你没关系。」</p><p>「给多少？」</p><p>裴先生看了他一会儿，好像没想到他会先问这个。</p><p>「三千。」</p><p>他说好。</p><p>签字是在旧海关大楼。那天大楼门口的台阶上正好站着一排穿制服的人在拍合影，裴先生领着他从边上绕过去，他好奇，扭头看了一眼，摄影师说「边上那个孩子让一让」，他往旁边挪了半步，背着手。后来他才知道，他那半张脸还是被拍进去了。</p><p>签字的屋子在地下，很冷。桌上摊着一张表，「继承人」一栏空着。他问裴先生年龄写在哪，裴先生说这张表不用写年龄。</p><p>他签了。名字，日期。写日期的时候，他照福利院教英语的志愿者那样，在「7」中间加了一道横杠。</p><p>门口有个值夜的男人一直看着他。那个人用左手端着搪瓷杯，看他签完，看他把笔放下，什么也没说。</p><p>拿了钱，他第二天就把押金交了。那个发烧的小孩后来好了。</p><p>一个月以后，院里来了一个戴白手套的老人，要单独跟他说话。老人问他知不知道自己签的是什么，他说不知道。老人跟他讲了。讲完问他：</p><p>「你那个名字，要不要我替你从记录上挪走？」</p><p>「挪走了，这事就没了？」</p><p>「事还在，」老人说，「只是找不到你。」</p><p>他想了很久。窗外有小孩在院子里踢一只瘪了的球，踢得砰砰响。</p><p>「不必。」他说，「我自己烧。」</p><p>他十七岁那年离开福利院。走之前，他去找过一回那张收据。</p><p>裴先生给他钱的时候让他签过一张收据。他打听到裴先生替一个姓季的人做事，季先生的公司在码头边一栋新楼里。他半夜翻上二楼的窗台，用手肘去撞玻璃，玻璃比他想的厚，撞了三下才碎，碎碴子划开了他右手虎口，血一下子流满了手腕。</p><p>办公室里什么都没有。保险柜、抽屉、文件架，全是空的，或者全是别的东西。那张收据不在这儿。</p><p>他用衣服裹着手从窗户爬出去，在码头边坐到天亮。手上的血干了，结成一层黑壳。那天早上他想明白了一件事：东西被人拿走了，想拿回来，光有胆子不行，得知道它在哪，得知道它是怎么被拿走的，每一步。</p><p>他去了屿城。</p><p>屿城有一家永明照相馆，老板明叔，帮人拍证件照，也帮人「换照」。明叔看了他的手，又看了他的脸，没问为什么，从柜台底下拿出一本厚本子，翻到空白页。</p><p>「借你一个名字。」明叔说，「什么时候还？」</p><p>他想了想：「不知道。」</p><p>明叔在归还栏那里空了一格，没填。</p><p>那一年他用新名字办了身份证，进了一家物流公司搬货，后来跟车，后来调度。他学会了看提单，看报关单，看转让合同，学会了在一堆盖着红章的纸里找出那一道口子。二十四岁那年，他接了第一单，替一个老太太从她侄子手里拿回了亡夫的一块怀表。怀表是侄子用一份假遗嘱拿走的。他没偷，他找到了遗嘱上公证员的签名日期比公证员的上岗日期早了一天。</p><p>那一单他收了老太太一顿饭钱。</p><p>团就是那一年开的。他给自己定了一条规矩：只接拿回来的单子，不接拿走的。</p><p>后来人一个一个来了。有一年，Kevin带来一个温和的、说话会夹英文的年轻人，说是从小一起长大的朋友。年轻人自我介绍，说他姓裴。</p><p>他正在白板上写日期，写到「7」，笔停在半空。</p><p>那年的裴先生三十九岁，戴细边眼镜，手指上有墨水渍。眼前这个人没戴眼镜，可他递过来的那只手，手指形状一模一样。</p><p>「欢迎。」他说，把那道横杠补完了。</p><p>他没告诉任何人。他想看看，那个人的儿子长成了什么样的人。</p>"}, "hyunjae": {"title": "十二碗", "html": "<p>他九岁就会端托盘了。</p><p>陈姨的大排档在旧海关大楼对面的巷口，一张折叠桌，四个塑料凳，一口烧得发黑的炒锅。每天夜里十一点半，楼里会打电话来，说「老样子」。老样子是十二碗：八碗炒河粉，两碗白粥，一碗不放葱的汤面，一碗多放辣的炒饭。</p><p>「不放葱的是谁？」他问。</p><p>「沈组长。」陈姨颠着锅说，「多放辣那碗是器械老金的，他说吃辣睡得着。」</p><p>「真的？」</p><p>「假的。他就是爱吃辣。」</p><p>他把十二碗装进两个竹提篮，一手一个，穿过马路。值夜室在地下，楼梯很陡，他走得很慢，汤一滴都不洒。门口那个瘦高的叔叔每回都揉揉他的头，叫他「小陈」，他纠正过很多次自己姓李，那个叔叔每次都说「好的小陈」。</p><p>那个叔叔就是老金。</p><p>值夜组散的那年冬天，十一点半的电话没有再响。陈姨在锅前站到一点，把多做的炒河粉倒进一只铝桶，第二天拉去了福利院。</p><p>「浪费。」她说。</p><p>她说的不是那桶炒河粉。</p><p>他十七岁那年，大排档拆了，母亲去了屿城给人做帮厨。他跟着过去，在一家会所做侍应。会所接的都是酒会，宾客进门前要过一道安检，安检的人穿灰制服，制服左胸绣一个「垣」字。</p><p>他在会所做到第五年，已经能一眼看出哪位客人要续杯、哪位客人要叫车。那天的酒会是一个收藏家的生日宴。他端着香槟在人群里走，走到第三圈，一个男人从托盘上拿走一杯，又把另一杯放回来。</p><p>「你也喝一杯，」男人笑着说，「站一晚上了。」</p><p>他接了。会所规定侍应不准喝酒，可宾客递的不能不接，他抿了一口。</p><p>后来的事他记得不太清了。他记得自己去了一趟后台的储物间，记得储物间的柜门是开着的，记得柜子里有一只丝绒盒子，盒盖半开，里面是一块金表。他记得自己伸手把盒盖合上了，因为盒盖开着不对。</p><p>然后他就在地上了。</p><p>醒过来的时候，周围站了一圈灰制服。丝绒盒子空了，金表在他的围裙口袋里。</p><p>「我只是把盖子合上。」他说。</p><p>没人听。会所赔了钱，扣了他三个月工资，开除了他。收藏家没报警，说「年轻人，算了」，说得很宽厚。他后来听说，那块表本来就是那个收藏家要出手的赃物，「被侍应偷了」以后，保险公司赔了一笔，表换个来路，又出现在另一场拍卖上。</p><p>他没法证明。他确实碰过那只盒子，指纹在上面。</p><p>那以后，别人递给他的东西，他一口都不吃。</p><p>他找了一份后厨的活，切了两年葱。后厨的人都喜欢他，因为他会在员工餐里偷偷多放一块肉，也会在打烊前把剩下的炸鸡分成几份，装在饭盒里，挨个塞进别人的包。</p><p>「你自己不吃？」</p><p>「吃过了。」他说。他吃的是自己做的那份。</p><p>二十四岁那年冬天，一个男人来后厨后门找他。男人比他大一点，右手虎口有一道白疤，背着手站在垃圾桶旁边，等他倒完泔水。</p><p>「你妈是不是在旧海关对面摆过摊？」</p><p>他手里的桶停住了。</p><p>「礼拜四，」男人说，「三轮车，两个铝桶，炒饭和汤。排在最后一个的能多刮一勺锅底。」</p><p>他看了这个人很久，想起来了。福利院那一队孩子里，最后一个永远是同一个人，不说话，端着碗站到最后，刮锅底刮得很仔细。</p><p>「你那时候瘦。」他说。</p><p>「现在也没胖多少。」男人说，「我在做一件事，缺一个管后勤的。要会算人头，会订饭，会在别人饿之前就知道谁饿了。」</p><p>「工资呢？」</p><p>「比切葱多。」</p><p>他把桶放下，在围裙上擦了擦手。</p><p>「我先说好，」他说，「我做的饭你们得吃。你们递我的，我不一定吃。」</p><p>男人点头，好像早就知道。</p><p>那天晚上他回家，母亲在灯下择豆角。他说他换了份工作。母亲问做什么，他想了想，说：「还是送饭。」</p><p>母亲说那好，送饭好，别洒了。</p>"}, "juyeon": {"title": "巡更", "html": "<p>父亲每天出门前要检查三遍门。</p><p>拧一下把手，推一下，再拧一下。Juyeon小时候以为那是父亲的毛病，后来才知道那是巡更的规矩：每一扇门过手三次，记下时间，签字。父亲在值夜组干了十一年巡更，夜里从地下库房走到四楼，每层十二扇门，一夜走四遍。</p><p>「为什么是四遍？」</p><p>「因为三遍不够，五遍太累。」父亲说。</p><p>父亲话很少，说话也慢，一句话中间要停一停，像在走楼梯，每一级都要踩实。Juyeon后来也这样说话，母亲说父子俩一模一样，急死人。</p><p>十五年前那个礼拜，父亲回来得很早。他坐在门口换鞋，换了很久，一只鞋带系了三次。</p><p>「明天不去了。」他说。</p><p>母亲问为什么，他没说。第二天他没去，第三天也没去。第二个礼拜，家里收到一封信，母亲看完就把信折起来放进了抽屉，抽屉上了锁。</p><p>Juyeon那年十四岁。他用一根回形针打开了那个抽屉，那是他第一次开锁。信上写着：李广福，值夜期间记录缺损，负连带责任，除名。下面有一行小字：处分已载入人事册。</p><p>「人事册在哪？」他问父亲。</p><p>父亲看着他，又看了看那把被撬开的锁，没骂他。</p><p>「在一个你够不着的地方。」父亲说。</p><p>除名的人找不到活。父亲去当保安，人家一查档就不要。去当门卫，一查档又不要。最后他去了搬家公司，那里不查档，只看你扛不扛得动。他扛得动。他扛了九年，腰坏了，膝盖也坏了，可每天出门还是要检查三遍门。</p><p>Juyeon十八岁跟着父亲去搬家。他力气大，话少，客户都喜欢他，因为他搬东西从来不碰坏，每件家具进门之前都要先看一眼门框，量一下拐角。</p><p>父亲在他二十二岁那年走了。走之前一个礼拜，父亲在病床上跟他说了一句话，说得很慢，中间停了三次：</p><p>「那一夜……不是我们……没看住。」</p><p>Juyeon握着他的手，等他说下去。他没说下去。</p><p>二十三岁那年，Juyeon接了一单活，给一家画廊搬一批货。货单上写的是六箱，他搬的时候发现第四箱比第三箱轻了很多，箱子侧面的封条贴歪了，新贴的。</p><p>他没声张，搬完六箱，在交接单上签了字。然后他去找了货主。货主是一个右手虎口有疤的男人，正背着手站在画廊门口抽烟。</p><p>「第四箱是空的。」Juyeon说。</p><p>男人看了他一眼：「你怎么知道？」</p><p>「轻。」</p><p>「那你为什么不在交接单上写？」</p><p>Juyeon想了一会儿。「写了，你们会吵起来。」他说，「吵起来……东西就更找不到了。」</p><p>男人把烟掐了。</p><p>「东西是我的委托人的，」他说，「被人用一份假合同拿走了，我们在把它弄回来。第四箱本来是空的，是我让它空的。你要是写在单子上，我今天就白干了。」</p><p>「哦。」Juyeon说。</p><p>「你想过干点别的吗？」男人问。</p><p>Juyeon又想了一会儿。他想得很慢，男人也不催他，就那么站着等。画廊门口的风铃响了好几遍。</p><p>「如果是……拿回来的活，」他说，「我想把我爸的档拿回来。」</p><p>男人看着他，忽然笑了一下。那是Juyeon第一次看见他笑，笑得很短，好像笑到一半自己发现了，赶紧收住了。</p><p>「你是第一个这么说的。」男人说。</p><p>后来团里人越来越多，每个新人来面试，团长都会在黑暗里问那个问题：为什么。很多人说钱，说刺激，说欠了人情。Juyeon有时候坐在门口听，听了好几年，再没听到第二个人说「拿回来」。</p><p>直到有一天，一个淋了雨、伞骨折了一根的女孩说了。</p><p>他坐在门边，没回头，只是把手放在门把手上，拧了一下，推了一下，又拧了一下。</p>"}, "younghoon": {"title": "借名簿", "html": "<p>永明照相馆的暗房在楼梯底下，门上挂一块黑布。</p><p>Younghoon七岁就被允许进暗房，条件是不碰药水，不开灯。他坐在一只倒扣的木箱上，看父亲把相纸浸进显影液，看一张白纸慢慢长出一张脸。先是眼睛，然后是鼻梁，最后是嘴。</p><p>「为什么先是眼睛？」</p><p>「因为眼睛最黑。」父亲说，「越黑的地方越先出来。」</p><p>照相馆白天拍证件照。一寸、两寸，白底、蓝底、红底。父亲拍照的时候话很多，「下巴收一点」「别抿嘴」「想点高兴的事」，客人笑了，他就按快门。</p><p>晚上照相馆也接客。晚上来的人不拍照，他们带着一张别人的身份证，或者一张自己的旧照片，坐在柜台前，压低声音说话。父亲把他们领进暗房，门帘放下来，一谈就是很久。</p><p>Younghoon十五岁那年，有天晚上下楼喝水，看见柜台前坐着一个少年。少年比他大一两岁，右手缠着一圈脏纱布，背着手坐着，背挺得很直。</p><p>父亲从柜台底下拿出那本厚本子。本子是黑色硬壳的，边角都磨白了，Younghoon知道那是什么，叫借名簿。每一页三栏：借出的名字，借的人，归还日期。</p><p>「借你一个名字。」父亲说，「什么时候还？」</p><p>少年想了想：「不知道。」</p><p>父亲在归还栏空了一格。</p><p>那天晚上父亲在暗房里待到很晚。Younghoon隔着黑布听见他在自言自语：「十七岁……十七岁……」</p><p>后来Younghoon问父亲，借名字是犯法的吧。</p><p>父亲正在擦镜头，擦得很仔细。「是。」他说，「可有的人拿着自己的名字，就活不下去。」</p><p>「那借出去的名字，原来的人呢？」</p><p>「死了，或者走了，或者不要了。」父亲说，「名字跟衣服一样，没人穿就烂了。借出去，穿的人当心一点，还回来的时候还是好的。」</p><p>「要是不还呢？」</p><p>父亲把镜头盖拧上。</p><p>「那就一直欠着。」他说，「欠着的人做事会小心一点。」</p><p>父亲在Younghoon二十四岁那年中风，半边身子不能动，嘴也歪了。照相馆交给了Younghoon。他接手的第一件事，是把借名簿从柜台底下拿出来，从第一页翻到最后一页。</p><p>一共一百三十七个名字。还回来的一百零九个，归还栏里填着日期，是父亲的字。没还的二十八个，有的写着「已故」，有的写着「出境」，有的什么都没写。</p><p>那一格空得最干净的，就是十七岁的那个少年。</p><p>父亲走后半年，那个人来了。他已经不是少年了，虎口的纱布换成了一道白疤，站在柜台前，还是背着手。</p><p>「你爸的事，我听说了。」他说，「我来还个东西。」</p><p>Younghoon以为他要来还名字。可他放在柜台上的是一个信封，里面是一沓现金。</p><p>「这些年他没跟我要过钱。」那人说。</p><p>Younghoon把信封推回去。「我爸的规矩，名字不收钱。」</p><p>「那我欠的是什么？」</p><p>Younghoon翻开借名簿，翻到那一页，指着空着的归还栏。</p><p>「这个。」他说，「你哪天不用了，来填上。」</p><p>那人看着那一格看了很久。</p><p>「我在做一件事，」他说，「要用很多不是自己的脸。你爸会的那些，你会多少？」</p><p>「全会。」Younghoon说，「还会画。」</p><p>他从柜台底下抽出一张速写纸，三笔两笔，画了一个侧脸。下巴收着，嘴抿着，眼睛先画，最黑。</p><p>那人接过去看了看，折起来放进了口袋。</p><p>后来Younghoon给团里每个人都画过侧脸，正脸一张都没画过。有人问为什么，他说正脸要本人同意。</p><p>他没告诉别人的是，借名簿他一直带在身上，最后几页他自己续上了：侍应，布展工，档案馆临时工，每一个借出去的身份都写了归还日期，都按时还了。</p><p>只有前面那一格，他一直没去催。</p>"}, "q": {"title": "左手", "html": "<p>范师傅的锁匠铺开在档城档案馆后街，铺面只有两米宽，墙上挂满了钥匙坯子，风一吹叮叮当当地响。</p><p>Q十六岁进铺子当学徒。范师傅教他的第一件事不是开锁，是封蜡。</p><p>「锁开了，」范师傅说，「得让人看不出开过。」</p><p>他教他把红蜡烤软，压进锁眼，取出来就是一个模子。他教他收尾的时候往左一拧，蜡封的花纹会多出半道，只有自己看得出来。「这叫手印，」范师傅说，「以后有人仿你，你一看就知道。」</p><p>Q学得很快。他手稳，耐得住，一个锁芯能对着灯看一个钟头。范师傅说他是这条街上最好的学徒，可惜不爱说话。</p><p>十九岁那年秋天，范师傅住院了。铺子由Q一个人看。有一天傍晚，一个穿旧雨衣的男人走进来，帽檐压得很低，问能不能开档案馆的柜子。</p><p>「不能。」Q说，「那是公家的。」</p><p>男人没走。他从雨衣口袋里掏出一个信封放在柜台上，用的是左手。</p><p>「柜子里有一本册子，」他说，「册子上写着十二个人做错了一件事。他们没做错。我要把那几页拿出来，不是为了卖，是为了让他们以后找得到工作。」</p><p>Q看着那只左手。手背上有老年斑，指节很粗，可很稳。</p><p>「你为什么不自己开？」</p><p>「我老了，」男人说，「手还稳，眼睛不行了。」</p><p>信封里的钱，够范师傅的手术费。</p><p>那天夜里下雨。档案馆二楼东侧的柜子是老式的三簧锁，Q用了七分钟。男人站在他身后打手电，手电光一直很稳。柜子开了，男人抽出一本蓝皮册子，塞进雨衣里。</p><p>「走。」男人说。</p><p>Q转身的时候想起来，他进来的那扇侧门没关。范师傅说过，进门第一件事是想好怎么出去，第二件事是把别人追进来的路堵上。他忘了第二件事。</p><p>楼梯间里有脚步声。一个穿灰制服的保安冲上来，手电光扫过Q的脸。</p><p>「站住！」</p><p>男人往另一边跑了。Q往楼梯跑。那段楼梯是老式的水磨石，雨水从没关的侧门灌进来，湿了一大片。保安追到第三级台阶，脚下一滑。</p><p>Q回头的时候，那个人已经躺在楼梯拐角了，腰卡在铁扶手上，嘴张着，发不出声音。</p><p>Q站在楼梯上，站了大概五秒钟。他可以跑，侧门就在下面，雨很大。</p><p>他走下去，跪在那个人旁边，按住他的肩膀不让他动，喊人。</p><p>后来的事很快。警察，医院，审讯室。他们问他雇主是谁，他说不知道。他们问长什么样，他说没看清脸。他们问还有什么特征，他想了很久，说：</p><p>「他用左手递钱。」</p><p>这一条没人当回事。他一个人扛了入室、盗窃未遂、过失致人重伤。他被判了三年。</p><p>那个保安姓孙，腰断了，再也没回过垣卫。Q在里面打听过，听说他有个儿子，十七岁，在念高中。</p><p>出来那年Q二十二岁，范师傅已经去世了，锁匠铺盘给了别人。他在档城洗了三年车，每回有灰制服的车开进来，他都低着头。后来他去了屿城，那里没人认识他的脸。可他要租房、要找活，都得有个干净的名字。</p><p>有人告诉他，屿城有家照相馆能「借名字」。</p><p>他去了。柜台后面坐着一个年轻人，个子很高，正在速写本上画画。年轻人听完他的来意，没去拿柜台底下那本黑皮簿子，而是把他从头到脚看了一遍。</p><p>「你的手很稳。」年轻人说。</p><p>「我是开锁的。」</p><p>「你开锁之前，会先干什么？」</p><p>Q想了想。「封退路。」他说，「先封别人的，再留自己的。」</p><p>年轻人合上速写本。</p><p>「名字我不借给你，」他说，「借给你，你就得一直躲着。我带你去见个人，他那里不用躲。」</p><p>Q后来在团里定了一条规矩：任何一单，第一件事是封退路。没人问他为什么。团里的人大多不问为什么，只有新来的那个小孩，有一回盯着他手里的红蜡看了很久，说：</p><p>「你左拧收尾，是谁教的？」</p><p>Q说是师傅教的。</p><p>那个小孩点点头，没再问。他看Q的眼神，Q当时没看懂。</p>"}, "sunwoo": {"title": "〇一六", "html": "<p>凌晨三点，阳台上有火光。</p><p>十三岁的Sunwoo光着脚站在阳台门口。父亲蹲在一只搪瓷脸盆前面，往盆里一页一页地放纸。纸是蓝格子的，烧起来卷边，火苗是绿的，大概是墨水里有什么东西。</p><p>「你在烧什么？」</p><p>父亲没回头。「睡不着，找点事干。」</p><p>「找点事干为什么要烧东西？」</p><p>「因为纸放着也睡不着。」</p><p>Sunwoo在他旁边蹲下。盆里的纸烧得差不多了，最后一页上有一行字还没烧到，他看见了「器械」两个字，后面跟着一串数，和父亲刻在零件上的那种一样。</p><p>父亲用火钳把那一页按了下去。</p><p>「这本是什么？」</p><p>「值班的记录。」父亲说，「没用了。都烧了。」</p><p>那时候父亲已经失眠三年了。他每天夜里坐在餐桌前，用手指敲桌面，一秒一下，敲一整夜。母亲说他以前不这样，以前他一沾枕头就打呼，打得隔壁都听得见。</p><p>「你敲这个干什么？」Sunwoo问过。</p><p>「数着。」父亲说，「数着就不想别的了。」</p><p>「数到多少能睡着？」</p><p>父亲想了想：「还没数到过。」</p><p>父亲是做钟的。不是钟表店那种，是给单位、给车站、给老楼做大钟，齿轮比Sunwoo的手掌还大。他做的每一个零件都刻编号，从〇〇一开始。Sunwoo小时候在他工作台底下翻到过一个铁皮盒子，盒子里是一排铜销钉，每一枚都有号，〇〇一到〇〇八，中间断了一个，接着是〇一〇。</p><p>「九呢？」</p><p>「九给人了。」父亲说，「给一口钟了。」</p><p>「哪口钟？」</p><p>「一口有十二个孔的钟。」父亲说，「挂在一个你不用去的地方。」</p><p>父亲最后一个编号是〇一六。那是一口给小学做的钟，挂在操场边上，Sunwoo上学每天都从底下走过。父亲做完那口钟的第二年冬天就走了。医生说是心脏，母亲说是熬的。</p><p>收拾遗物的时候，Sunwoo在那只铁皮盒子里发现了一张字条，父亲的字：</p><p>他不知道沈是谁。他问母亲，母亲摇头，说你爸以前单位的人，散了，不来往了。</p><p>那年他十五岁，跟着母亲去了屿城。屿城没有人知道他爸是谁，他也不说。他在学校里话不多，可一开口就把老师噎住。物理老师问他为什么作业只写答案不写过程，他说：「老师，您问这个，是想让我夸您题出得好吗？」</p><p>被罚站了一个礼拜。</p><p>他睡不好，从十五岁开始。夜里躺在床上，手指在床沿上敲，一秒一下。有时候敲到天亮，有时候敲到一半爬起来，拆家里的东西。闹钟、收音机、电饭煲的定时器，拆开，装回去，有时候装回去多出一个零件，他就把那个零件刻上号收起来。</p><p>他刻的第一个号是〇一七。</p><p>后来他在屿城电子市场后面的维修摊上认识了一个人，叫New。New的爷爷以前在档城修收音机，跟他爸是老熟人，两个老头以前常在一张桌子上喝酒，一个拆收音机，一个拆钟。New比他大两岁，蹲在摊位上给人修对讲机，他就坐在旁边的小板凳上看，看完说：「你这个焊点虚了。」</p><p>「你会？」</p><p>「不会。」Sunwoo说，「但我知道它虚了。」</p><p>New把烙铁递给他。</p><p>他二十三岁那年，有一天New的摊位上来了一个男人，手里拿着一把电子锁的锁芯，问谁能看懂这个。男人话很少，说话前会把锁芯翻过来又翻过去，看了一遍又一遍。</p><p>New指了指Sunwoo。</p><p>Sunwoo接过来，拆了，十分钟以后装回去，多出一根弹簧。</p><p>「多了一根。」男人说。</p><p>「它本来就多一根。」Sunwoo把弹簧放在男人手心，「装这把锁的人留了一根，到时候锁芯卡死，开锁的人就得重新配。你要是在门口卡住了，后面的人就来了。」</p><p>男人看着那根弹簧，看了很久。</p><p>「你怎么知道后面会有人来？」</p><p>「我不知道。」Sunwoo说，「我就是觉得，要是我装这把锁，我也会留一根。」</p><p>男人把弹簧放进口袋。</p><p>「我们那里缺一个管线路的。」他说，「活不多，就是夜里要醒着。」</p><p>Sunwoo笑了一下。</p><p>「夜里醒着，」他说，「这个我熟。」</p><p>他入团那天，团长问他为什么。他说：「睡不着，找点事干。」</p><p>他没说他爸也这么说过。</p><p>后来团里有人问他，为什么编号从十七开始。他说：「前面的号被人用了。」然后就岔开了话题。</p>"}, "new": {"title": "代收处", "html": "<p>崔记修理在档城最老的那条街上，对面是邮局，隔壁是一家装订铺。</p><p>New七岁那年，祖父教他认第一个零件。是一只电子管，玻璃泡里面一根灯丝，祖父把它举到窗口，让他对着太阳看。</p><p>「这里面是空的。」祖父说，「抽成真空，电才跑得快。」</p><p>「空的为什么还要装玻璃？」</p><p>「不装玻璃，空就跑了。」</p><p>祖父的修理铺什么都修。收音机、电视机、电扇、对讲机。旧海关大楼值夜组的对讲机都是在他这儿修的，一个月来一趟，一次十二台。来送的人有时候是一个姓金的叔叔，有时候是一个左撇子的瘦高个，拿东西用左手。</p><p>金叔叔每次来都不走，坐在柜台边上跟祖父喝茶，看祖父拆机器，自己也拆。两个人一个下午说不了十句话，桌上的零件倒是越摆越多。</p><p>隔壁装订铺的纪伯伯偶尔也过来，带一袋糖炒栗子，剥好了放在New手边，自己一个不吃。</p><p>「纪伯伯为什么不吃？」</p><p>「他左手剥不动。」祖父说，「右手剥的给你吃了。」</p><p>New后来才知道，纪伯伯的左手有旧伤，翻页都用指腹。</p><p>邮局门口有一排代收信箱，铁皮的，每个格子上贴着号码。祖父租了一个，三十七号，用来收南方寄来的零件。他给New起了一个代号，写在三十七号的代收人一栏，说以后零件寄来，你去取。</p><p>「为什么不写你的名字？」</p><p>「我的名字认识的人太多了。」祖父说，「你的名字还没人认识，干净。」</p><p>New十六岁那年祖父去世。修理铺盘出去了，三十七号信箱祖父交代给了纪伯伯，说帮孩子留着。New跟着父母去了屿城。</p><p>他在屿城电子市场后面摆了一个摊，修对讲机，修手机，修一切插电的东西。十九岁那年，摊上来了一个中年女人，拎着一台安保公司的老式对讲机，说接收不灵，要换。</p><p>「不用换，」New说，「拆开看看。」</p><p>女人说她不会拆。</p><p>「我教你。」</p><p>他教她拧开后盖，教她认哪根是天线，哪根是电源线，教她用橡皮擦擦触点。女人学得很认真，拆完装回去，对讲机响了，她高兴得像个小孩。</p><p>她姓郑。后来她常来，不是来修东西，是来跟他学。她学会了拆对讲机，又教他看门禁系统，「哪个探头是摆样子的，哪个是真看的」。</p><p>有一回郑姐带了一个同事来。那人六十来岁，瘦，话少，从口袋里掏出一个旧遥控器，用左手递过来。</p><p>「按键失灵了。」那人说，「修得好吗？」</p><p>New拆开，换了两个触点，十分钟修好了。</p><p>「这是开什么的？」他随口问。</p><p>那人想了一下。「开灯的。」他说，「也关灯。」</p><p>郑姐叫他「沈叔」。New觉得他有点面熟，可想不起来在哪见过。很多年以后他才想起来，是在祖父的修理铺里，那个用左手拿对讲机的瘦高个。</p><p>那个遥控器，就是后来第一季那四十秒谁也挪不动的原因：规程写着，已报备的切换测试，只有它能改期。New知道这件事的时候，正在仓库里拆一台对讲机，拆到一半停了。他没跟任何人说，他十九岁那年修好的东西，后来帮了他们，也差点害了他们。</p><p>他二十六岁那年，Sunwoo说团里要一个人管工具，问他来不来。</p><p>Sunwoo说这话的时候坐在他摊位的小板凳上，手里转着一把螺丝刀。他们认识六七年了，Sunwoo每次来都坐那张小板凳，修好一样东西就刻一个号，刻到第一百多号的时候，他说了这句话。</p><p>「你们那里修什么？」New问。</p><p>「什么都修。」Sunwoo说，「主要是修被人弄坏的来路。」</p><p>New把烙铁放回架子上，想了一会儿。</p><p>「我在档城有个信箱。」他说，「三十七号。我爷爷留的，代收人写的是我的代号，只有纪伯伯知道。以后要是有什么东西不方便寄到这儿，可以寄到那儿。」</p><p>「谁会给我们寄东西？」</p><p>「不知道。」New说，「留着吧。空着的东西，总有用的那天。」</p><p>他入团那天，进门先蹲下来，把自己那把椅子腿上的螺丝拧紧了半圈。团长看见了，没说话，后来那把椅子一直是他的。</p>"}, "kevin": {"title": "三天", "html": "<p>到温哥华的第一个礼拜，Kevin一句话都没说。</p><p>他那年十四岁，英语只会数到二十。新学校的老师把他安排在靠窗的座位，同学们围过来说了很多话，他听不懂，就笑。笑多了，有个男孩说他是傻子，他听懂了这个词，没再笑。</p><p>他开始看。</p><p>他看谁跟谁站得近，谁一进门就往哪个角落走，谁说话的时候眼睛会先看老师。他发现那个说他傻子的男孩每次说完坏话都会回头看一眼，看后排一个高个子有没有在听。他发现午饭的时候坐在最边上的一个华人男孩，每天都把便当里的一块肉夹给对面的人，自己吃米饭。</p><p>第四天，他走过去，坐在那个华人男孩旁边。</p><p>「你为什么不吃肉？」他用中文问。</p><p>那男孩愣了一下，说：「我爸说，在外面要先对别人好。」</p><p>那个男孩叫Jacob，比他大一岁，比他早一个月被家里送出来，一个人住在寄宿家庭。他说他父亲做艺术品生意，最近「家里有点事」，让他在这边先念几年书。</p><p>后来他们一起念完了中学。Jacob教他弹吉他，他教Jacob认谱。Jacob的口头禅是「it&#x27;s fine」，Kevin后来发现，Jacob每次说「it&#x27;s fine」的时候，都是不fine的时候。</p><p>Kevin的父亲在他十四岁那年去世，就在他们出国前三个月。</p><p>父亲是档城海关的关员，一辈子在码头查货。他留下一个铁皮柜，柜子里有十几本工作日记，母亲带去了温哥华，放在储物间里，从来没打开过。</p><p>Kevin二十岁那年打开了。</p><p>日记写得很干，日期、船号、货物、处理结果。他一本一本看下去，看到三十多年前的一页，字忽然多了：</p><p>下面一行是后来补的，墨水颜色不一样：</p><p>Kevin把日记合上，放回柜子里。后来那几年，他又打开过三次，每次都停在这一页，没往下看。</p><p>他学的是钢琴调律。这行人少，活不多，可哪里都要。他二十五岁回国，在屿城接调律的活，美术馆大厅里那台演奏用的三角琴归他管，一个月调一次。</p><p>那天他调完琴，坐在琴凳上收工具，看见大厅里有几个人。</p><p>一个瘦高个坐在长椅上，右手食指在膝盖上一下一下地敲，看起来在等人，可他的眼睛一直在数天花板上的摄像头。一个说话很慢的大个子站在侧门边，每隔一会儿就去拧一下门把手。还有一个背着手的男人，右手攥着左手腕，在展厅门口站了二十分钟，一张画都没看。</p><p>Kevin没走。他第二天又来了，第三天又来了。他调了三天琴，那台琴根本不用调三天。</p><p>第三天傍晚，那个背着手的男人走到钢琴旁边。</p><p>「这琴调好了吗？」</p><p>「早好了。」Kevin说。</p><p>「那你还来？」</p><p>「你们不也还来。」</p><p>男人看了他一会儿。「你看见什么了？」</p><p>「你们在找一件东西的来路。」Kevin说，「找了三天，还没找到，因为你们看的是展厅。来路不在展厅，在后面的库房。那个敲膝盖的人数了十七个摄像头，漏了两个，在钢琴上面的吊灯里。」</p><p>男人抬头看了看吊灯，没说话。</p><p>「还有，」Kevin说，「你站的位置离出口最远。你是最后一个走的那个。」</p><p>那天晚上他去了仓库。团长在黑暗里问他为什么，他想了很久，说：「我父亲以前扣过一件东西，我想知道它后来去哪了。」</p><p>他没说那件东西是什么。他也没说，他调琴的那三天，在美术馆的赞助人名单上看到了一个姓氏，和他那个从小一起长大的朋友一样。</p><p>一年以后，他把Jacob带进了团。</p>"}, "jacob": {"title": "赞助人卡", "html": "<p>父亲在医院里只认得两样东西：Jacob，和一张卡。</p><p>那是一张屿城美术馆的赞助人卡，深蓝色，烫金字，有效期十二年前就过了。父亲把它压在枕头底下，护士要拿去消毒，他攥着不放。</p><p>「爸，那张卡早就没用了。」</p><p>父亲看着他，眼睛很浑。中风以后他说话很慢，一个字一个字往外挤。</p><p>「有……用。」</p><p>Jacob那年二十七岁。他十五岁被送去温哥华，在那边念完中学、大学，找了一份在画廊做助理的工作，每年圣诞节给家里打一个电话。父亲每次都说「家里都好」「生意都好」，说完就挂。他后来才知道，从他出国那年起，家里就没好过：父亲的生意一年不如一年，借了很多钱，房子卖了，最后一个人住在一间出租屋里，中风了三天才被房东发现。</p><p>他辞了工作回国。</p><p>父亲清醒的时间越来越少。有一天下午阳光很好，父亲忽然坐起来，指着窗外说：「那个孩子。」</p><p>「哪个孩子？」</p><p>「瘦的。」父亲说，「排在最后。三千块。」</p><p>「爸，你说什么？」</p><p>父亲没回答。他从枕头底下摸出那张赞助人卡，塞进Jacob手里，用了很大的力气。</p><p>「欠着。」他说。</p><p>那是他说的最后一个完整的句子。两个礼拜后，他走了。</p><p>Jacob收拾出租屋的时候，在床底下找到一个纸箱。纸箱里是父亲几十年的工作笔记，大部分是艺术品的交易记录，买家、卖家、成交价、佣金。有一本封面写着「季」，里面只有几页，最后一页写着：</p><p>Jacob在出租屋的地板上坐了一夜。</p><p>他不知道那顶冠后来去了哪，也不知道那个十六岁的孩子后来怎么样了。他只知道父亲一辈子没在任何一场交易里手软过，只有这一次，他在本子上写了一句「他问年龄写在哪」。</p><p>他用父亲那张过期的赞助人卡，在美术馆找了一份讲解员的工作。馆里有人认得这个姓，他就把胸牌别反了，名字朝里。他想离那些东西近一点，看看它们都是从哪来的，又是怎么来的。</p><p>半年后，他在馆里的钢琴边上看到了Kevin。</p><p>两个人愣了很久，Kevin先笑了，说：「我就说这个背影眼熟。」</p><p>那天晚上他们在美术馆后门的台阶上坐到很晚。Kevin说他在跟一伙人做事，专门把被人用假手续拿走的东西拿回来。</p><p>「你要来吗？」</p><p>Jacob看着手里的赞助人卡，翻过来，又翻过去。</p><p>「我父亲，」他说，「做过很多这种假手续。」</p><p>Kevin没说话，过了一会儿说：「我知道。」</p><p>「你知道？」</p><p>「我在赞助人名单上看到过你家的姓，」Kevin说，「看了一年了。」</p><p>Jacob笑了一下，说：「It&#x27;s fine.」</p><p>Kevin说：「你每次说这句话都不fine。」</p><p>他第二天去见了团长。团长在白板上写日期，写到一个「7」，笔停了一下，才把那道横杠补完。团长跟他握手，握得很紧，比一般人握得久。</p><p>「欢迎。」团长说。</p><p>Jacob觉得这个人的眼神有点奇怪，好像认识他，又好像在等他说什么。可那天他什么也没说。</p><p>一年半以后，一个姓沈的老人在美术馆员工通道口拦住了他。老人说话很轻，用左手递过来一张照片，照片上是一个女孩站在橱窗前的背影。</p><p>「我知道你父亲是谁，」老人说，「也知道他经手过什么。你想还，我给你一个机会。」</p><p>Jacob那一刻心里最先冒出来的不是「还债」，是一种奇怪的轻松：终于有人知道了。</p>"}, "eric": {"title": "数呼吸", "html": "<p>父亲在病床上躺了四十一天。</p><p>医生说腰椎断了两节，以后能不能站起来看运气。父亲醒着的时候不说话，睡着了会喘，喘得很急，一口接不上一口。</p><p>Eric那年十七岁，每天放学就去医院，坐在床边写作业。写不进去，他就数父亲的呼吸。一分钟十六下是正常的，二十下是不太好，二十五下他就去叫护士。他数得很准，护士后来都叫他「小计数器」。</p><p>「你爸是怎么摔的？」护士问。</p><p>「抓贼。」Eric说。</p><p>他是这么听说的。父亲是垣卫的夜班保安，那天晚上档案馆进了贼，父亲追上去，在楼梯上滑倒了。贼抓到了，是个十九岁的学徒，判了三年。</p><p>垣卫没赔一分钱。公司来了一个穿西装的人，说孙建平当晚不在排班表上，是自己跑去的，「属于个人行为」。西装男走的时候在床头放了一个果篮。</p><p>父亲看着那个果篮，看了很久，说了出院前唯一一句完整的话：</p><p>「我那天不在排班表上，是他们让我去的。说有人要进来，让我去守着。说抓到了，往狠里打。」</p><p>Eric手里的笔停了。</p><p>「那个学徒呢？」</p><p>「他本来能跑的。」父亲说，「他下来了，按着我，喊人。」</p><p>父亲没再说下去。Eric也没再问。可那天晚上他回家，在作业本最后一页写下了那个学徒的名字，是他从判决书上抄来的，写得很用力，纸都划破了。</p><p>父亲后来坐了轮椅。母亲去超市上夜班，Eric每天放学回家给父亲翻身、擦身、做饭。他学会了做饭，做得不好，父亲每次都吃完。他学会了在父亲疼的时候先笑一下，再说话，这样父亲就会以为没那么疼。</p><p>他也学会了一件事：别让人替你挡。父亲替垣卫挡了，垣卫说是个人行为。</p><p>那个学徒出狱的时候，Eric二十岁。他去了监狱门口，远远看着一个瘦瘦的年轻人走出来，没人接，站在路边看了一会儿天，然后往公交站走。</p><p>Eric断断续续跟了他五年。</p><p>他看着那个人在洗车行里低着头擦车，看着他每回见到灰制服的车就把帽子压低，看着他后来去了屿城，进了一家照相馆，又跟着照相馆的高个子进了一个仓库。他在仓库对面的便利店里坐了一个礼拜，买了七瓶可乐，一瓶没喝。</p><p>第八天，他准备走的时候，一个大个子从仓库里出来，慢悠悠地走到便利店门口，站在他桌子旁边。</p><p>「你……」大个子说话很慢，「坐了七天了。」</p><p>Eric先笑了一下。</p><p>「我在等人。」</p><p>「等谁？」</p><p>Eric没说话。大个子也不催，就那么站着，等他说。等了很久，久到Eric自己都受不了了。</p><p>「等一个开锁的。」他说。</p><p>大个子想了一会儿，点了点头：「那你进来等吧。外面冷。」</p><p>那天晚上团长在黑暗里问他为什么，他说：「我想看看一个人。」团长没问看谁，看了他很久，说：「看完了呢？」</p><p>「看完了再说。」</p><p>团长让他留下了。后来Eric才知道，这一屋子人，谁都没把「为什么」说全过。</p><p>他在团里待了一年半。他跟Q分过炸鸡，跟Q换过位置，看过Q每一单都先封别人的退路，再留自己的。有一回他忍不住问：「你左拧收尾，是谁教的？」Q说是师傅。</p><p>他想问的其实是另一句：你那天为什么不跑？</p><p>他没问。他已经知道答案了。</p><p>那天晚上他回去，把作业本翻出来，最后一页那个被划破的名字还在。他看了一会儿，没撕，把本子放回了抽屉最底下。</p><p>第二天，一个淋了雨的女孩来面试。他坐在桌边，在她说话之前先笑了一下。</p>"}};

/* 第一章 · 结局、设定与装配 */
(function(){
const E=window.ENGINE, A=window.__CH1A, P=window.__CH1P, h=window.__CH1H;
const {s,n,i,me,r,avgTrust}=h;

/* 收尾：按《偷心行动_长篇_S1.md》十七 散伙钟 还原，各结局共用 */
const nameBack=[

const KEEP=/^(route_seed_|eric_breath$|left$|names$|way$|talk$|likeSpice$|likeCilantro$|carryAlone$|nightOwl$)/;
function pack(S,en){
  const flags={}; Object.keys(S.flags||{}).forEach(k=>{ if(KEEP.test(k)) flags[k]=S.flags[k]; });

function dec(code){
  code=String(code||'').trim().replace(/\s+/g,'');
  if(code[0]==='{') return valid(JSON.parse(code));
  const m=code.match(/^TX1-([A-Za-z0-9+/]+)$/); if(!m) throw new Error('格式不对');
  let b=m[1]; while(b.length%4) b+='=';

 hub:{ap:3,title:'档城 · 模仿案',locs:['table5','district','audit'],exit:'回住处'},
 post:[
  ...needDed('mimic','mimic','q','学我手的人，没学我怕什么。'),
  n('复盘下来，时间线上对上了一件事：三起案子全落在散伙钟停的那一个礼拜里。第一起在钟停的前一天，第二起就在钟停当天，第三起是我们到档城的那天早上。'),
  i('那个人在画一条线。从钟停的那天起，一笔一笔，把我们的名字往一桩我们没干过的事情上引。'),
  s('hyunjae','钟也是他弄停的？'),
  s('q','钟上的蜡往右拧，这三起也都往右。'),
  s('eric','那就是看照片学的。'),
  n('这句话他在屿城就说过一次，这一次Q没回头看他。'),
  n('要查他是谁，就得调他的调阅底档。底档不对外开放，只对两种人开，一种是稽查员，一种是案件当事人。'),
  n('Q听完，第二天一早自己去了分局。是Juyeon早上起来看见他的床铺叠好了，才知道他走了。'),
  {p:'Q的床铺叠得方方正正。',c:[
    {t:'追去分局，拦住他。',tone:'sharp',then:[
      n('我赶到分局门口的时候，Juyeon已经在台阶底下站着了。他朝玻璃门里看了一眼，又看了我一眼，没让开，也没拦我。'),
      n('隔着玻璃，我看见Q已经在窗口前坐下了，笔握在手里。'),
      i('来晚了。他出门的时候，就是想好了的。')]},
    {t:'让Juyeon去门口等他。',tone:'soft',tr:{juyeon:1},then:[n('Juyeon去分局门口等他。Eric也跟着去了，说是去买早点。')]},
  ]},
  {bg:'bg2_post'},
  n('后来是Eric跟我讲的。Q在窗口填了一张《当事人自行登记》表，上面要填身份，填与案件的关系，还要贴照片。嫌疑人一栏那张十年前的照片，窗口的人从系统里调出来打印了一张给他，让他自己贴上去。他贴上了，在照片底下签了现在的名字，按了手印。'),
  {set:{qRegistered:1}},
  i('登记了，他就是当事人，有权阅卷。可登记了，这三起案子也就正式挂在了他的名下，要是查不清，他就是那个人。'),
  s('eric','窗口的人问他确不确定，说登记了就撤不掉了。他说确定。表上有一栏要填旧案编号，他也填了，我在玻璃外面都看见了。'),
  n('他说完低头剥手里的茶叶蛋，剥得很慢，一点一点把壳撕下来。'),
  me('填的是什么编号？'),
  s('eric','档城十年前的一个编号。也就是个编号。'),
  n('他把剥好的蛋递给我，自己没吃。'),
  {p:'',c:[
    {t:'接过来，掰一半给他。',tone:'soft',tr:{eric:1},then:[n('他看着那半个蛋，接了过去，攥在手里，没吃。')]},
    {t:'接过来。',tone:'cold'},
  ]},
  n('Q出来的时候手上还沾着红印泥，他在裤子上擦了两下，没擦掉。Juyeon从口袋里掏出一包湿巾，抽了一张递给他。他擦过了，指纹里还嵌着一点红。'),
  me('你可以等我们想想别的办法的。'),
  s('q','别的办法要等多久？他画的那条线，一个礼拜就画一笔。'),
  RB('c5a'),
  n('阅卷室只能看，不能抄，也不能拍，时间也卡得很死。只有当事人本人能进去，可以带一个协助人。Q带了Kevin。'),
  n('出来以后，Kevin上了车就闭上了眼睛。车开出两条街，他睁开眼，跟我要了纸和笔，在膝盖上写起来。车里只有笔尖的声音和Hyunjae在后排剥橘子的声音。'),
  n('他把那个人每一次调阅的日期和编号都默了出来，写完递给Q。'),
  {mini:'digit',then:r=>r.ok?[
    n('我先看出来了。中间那一行，有一个数字跟前后对不上。'),
    s('q','是八，那一页卷了边，看着像三。'),tr({q:1,kevin:1})
  ]:[
    n('Q看了一遍，在中间一行停住，拿过笔，把一个三改成了八。'),
    s('q','是八，那一页卷了边，看着像三。')]},
  s('kevin','对，是八。'),
  {ev:'kevinlist'},
  ...note('Kevin默写的调阅 · 一串编号',4,'那天晚上我把那张纸抄了一份，夹进本子里。那个人头一回调阅是在五年前，前面几次隔得很远，后面越来越密，最近几次全挤在这三个月里。'),
  me('五年前那一回，他查的是什么？'),
  s('kevin','垣卫安保的一份内部稽查报告。稽查人那一栏写的是陆衡。'),
  n('快到住处的时候，Q看着窗外说：'),
  s('q','我这张脸，在外面替别人干了三件我没干过的事。我自己干过的那一件，也还挂在那儿。'),
  n('他没说是哪一件。Eric坐在副驾驶，看着前面的路，手里还攥着那把茶叶蛋的壳。'),
  s('q','从今天起，干过的和没干过的，我都得自己记清楚了。'),
  n('那天晚上他找Younghoon要了一个本子。Younghoon给了他一本跟自己那本一样的，黑皮，牛皮纸内页，第一页空着。'),
  s('q','第一页该写什么？'),
  s('younghoon','写名字，写真名。'),
  n('Q拿着笔想了一会儿，写了。Younghoon没看，把头转开，去整理他的布料了。'),
  RB('c5b'),
 ],
 next:'c6'};

/* ---------------- 六　恒温库 ---------------- */
P.c6={label:'六 · 恒温库',dayLabel:'六',time:'上午',place:'档案馆 · 地下二层',card:'恒 温 库',cardSub:'六',bg:'bg2_vault',goal:'陪Jacob看一次原件，记住它。',
 pre:[
  n('Jacob要去的地方在档案馆地下二层，叫恒温库。他父亲当年经手的一本收据簿，原件作为另一桩旧案的证物存在那里。规矩是原件只许看一次，看完就封存。他申请了两个人的额度，一个是他自己，一个是我。'),
  me('为什么要带上我？'),
  s('jacob','因为你会抄。我怕看完出来自己记不住。'),
  me('可那里面不让抄。'),
  s('jacob','对，所以你得记住。'),
  n('申请批下来等了好些天。那些天里他照常去档案馆的讲解部报到，用的是本名，胸牌正着别。'),
  RB('c6a'),
  n('去恒温库那天早上，他在门口站了一会儿，把胸牌摘下来看了看，又正面朝外别了回去。'),
  n('两道门之间有一个小隔间，人站进去，等身上的温度降下来。墙上挂着一个温度计，指针慢慢往下走。我的手本来就冷，站了一会儿，指尖冻得发麻。Jacob看了我一眼，把自己的围巾解下来递给我。'),
  me('你自己不冷吗？'),
  s('jacob','It\'s fine，我还好。'),
  {p:'',c:[
    {t:'不接。',tone:'cold',then:[n('我没接。他就把围巾挂在我胳膊上，自己站到了前面。')]},
    {t:'接过来，围上。',tone:'soft',tr:{jacob:1},then:[n('围巾上还带着他的体温。他站到了前面。')]},
  ]},
  n('恒温库里很静，静到能听见呼吸碰到领口的声音。管理员是个五十来岁的女人，戴白手套，说话声音很低。她把一只档案匣放在读台上，揭开封条。'),
  s('keeper','看吧。看一次的意思是，你们出了这道门以后，它在你们记忆里的样子，就是它最后的说法。'),
  n('原件比我想的薄，一沓收据，每张几行字，几个签名。十五年前，一顶玉冠从旧海关库房里转了出去，经过一条一环扣一环的链子：鉴定，继承认领，转让。每一环都有人收了钱，签了字。'),
  {mini:'recall',then:r=>[{set:{recallOk:r.ok?1:0}}]},
  s('jacob','你看第三张。'),
  n('第三张收据的收款事由写的是「继承人签字费」，金额三千。签名是一个陌生的名字，干净得反常。字写得歪歪扭扭，是大拇指压着食指的那种握笔法，每一笔都用力往下按，有两处把纸按出了凹痕。'),
  n('日期是收款人自己填的。那个「7」，中间横着一道短杠。'),
  S=>{ E.addFind('f_bar'); return []; },
  i('这种「7」我见过。在仓库的白板上，每一次排日程，第七天，七号，七点，写的人每次写到这里都会停一下，才把那道横补完。我一直以为那只是习惯。'),
  S=>{ E.addFind('f_board7'); return []; },
  ...needDed('seven',null,'jacob','你记得白板吗？'),
  n('Jacob也在看我。他没问我在想什么。他早就知道我会看见什么，所以才申请了两个额度。'),
  me('你父亲知道这个人是谁吗？'),
  s('jacob','他知道那孩子是福利院出来的，才十六岁。孩子问他年龄要填在哪儿，他说不用填，回去还把这件事记在了笔记本上。他记了一辈子账，只有这一句跟账没关系。'),
  n('Jacob把原件推回匣子里。管理员要封存，他拦了一下。'),
  s('jacob','封存可以，可我要留一条记录，写明今天有人看过它，看的人是我。'),
  s('keeper','看过就封，这是规矩，用不着留记录。'),
  s('jacob','要是就这么封了，它就跟死了一样。留下一条记录，它就还活着。活着的东西，才有机会开口。'),
  s('keeper','留记录就算违约。原件一次性阅览，阅览人不得要求留存阅览痕迹，违者永久限制借阅。以后你在档城任何一个馆都借不出原件了。'),
  s('jacob','那就记吧。'),
  n('管理员把违约单拿出来填好，推到他面前，在违约事由一栏写了一行字，后面又加了四个字：本人自愿。'),
  n('Jacob看都没看就签了，签的是本名，「裴」字写得很大。'),
  {set:{jacobBreach:1}},
  ...note('违约单 · 经手人：恒温库管理员',1),
  {bg:'bg2_dark',fx:'lightrain'},
  n('上到地面，他站住了。外面在下小雨，档案楼之间的巷子很窄，雨落不下来多少，只在墙根积了一道湿。'),
  s('jacob','我想请你帮个忙，用处现在还不能讲。'),
  me('多大的忙？'),
  s('jacob','大概是要你把那两票都用上的那种。以后不管在哪儿，要是有人要把第三张上那个名字念出来，就让他自己念，别让任何一份记录替他念。'),
  {p:'',c:[
    {t:'「好。」',tone:'cold',set:{promiseJacob:1},tr:{jacob:1}},
    {t:'「他知道你已经看过了吗？」',tone:'soft',set:{promiseJacob:1},then:[
      s('jacob','他会知道的，我回去就跟他说。'),me('然后呢？'),
      s('jacob','然后他可能会生气，也可能不会。我说不准，我认识他两年了，还没见他生过气。')]},
  ]},
  n('他把围巾从我胳膊上拿回去围好，往巷子里走了。走了几步，他回过头。'),
  s('jacob','你的手，回去拿热水泡一泡。'),
  RB('c6b'),
  {bg:'bg2_noodle',fx:'none'},
  n('那天晚上他回到仓库，饭也没吃，直接去了团长那间小屋，门关上了。Hyunjae做了一锅萝卜炖排骨，盛了十二碗，把两碗放在小屋门口的凳子上。'),
  n('后来门开了，Jacob先出来。他眼睛有点红，脸上却很平静。他把门口那两碗排骨端起来，一碗端进屋里，一碗端回长桌，坐下吃了。'),
  n('团长那碗端进去以后，过了半个钟头，空碗放回了门口的凳子上。碗底下压着一张纸条，写着两个字：好吃。那个「好」字写得很用力。'),
  RB('c6c'),
 ],
 next:'c7'};

/* ---------------- 七　换电夜 ---------------- */
P.c7={label:'七 · 换电夜',dayLabel:'七',time:'深夜',place:'档案楼',card:'换 电 夜',cardSub:'七',bg:'bg2_dark',goal:'换电那一刻钟里，去凭证室补一张借阅凭证。',
 pre:[
  n('停电没有预告。档城每年检修一次线路，全城换电。发电机房换班要一刻钟，换班的间隙，监控走备用电池，画面延迟拉到最长。'),
  n('这件事是Sunwoo从值班册里翻出来的。值班册最后几页记着十五年前那一年的换电夜，组长在旁边批了一行：备用电池延迟比规定长，已报，未复。'),
  S=>{ E.addFind('f_battery'); return []; },
  s('sunwoo','十五年了。要是一直没人去修，现在还是那么长。'),
  n('那晚我们分了三条线。Sunwoo和New去城北的老铸造厂，查〇〇九那枚销钉的铜料是哪一炉出的。Q和Juyeon去追模仿案现场留下的蜡。我和Jacob进档案楼，补一张缺了的借阅凭证。'),
  n('Hyunjae开车，Eric坐副驾驶拿对讲机，Kevin在仓库里守着三条线的时间表。Younghoon给每个人做了一身档城夜里常见的衣服，我和Jacob是档案馆的夜班清洁工，袖口缝着馆里的标。'),
  s('younghoon','标是真的，从你们白天去的那个讲解部的旧制服上拆下来的。'),
  s('jacob','是我那件旧制服？'),
  s('younghoon','是你自己说不要了的。'),
  RB('c7a'),
  n('团长没分线。他坐在仓库长桌那头，面前摊着档城地图，三条线用三种颜色的笔描着，一晚上都没站起来过。'),
  {sfx:'hum'},
  n('城北先黑了，然后是城西，然后是档案馆群，一片一片地暗下去。'),
  n('档案楼里的应急灯是绿的，隔老远才有一盏，只照得见自己脚下。档案楼的走廊是空的，脚步声会被放大。我脱了鞋拎在手里，地是水磨石的，凉气从脚底板往上走。Jacob跟在我后面几步，也把鞋脱了。'),
  n('凭证室在三楼东头。我们走到二楼转角，我停住了。另一头的巡检灯先到了。'),
  {mini:'stealth',then:r=>[{set:{stealthTries:r.tries}}]},
  n('我能听见拿灯的人的呼吸，很平，很慢，是一个夜里在档案楼里走惯了的人。拿灯的人在原地站了一会儿，把灯转向另一边。'),
  n('巡检从主走廊拐进了侧廊，脚步声往远处去，走得不快，一步一步，好像在等什么。他让出来的那条路，正好通到凭证室。'),
  n('凭证室的锁用的是Q提前给我配好的钥匙。门开了，里面一排一排的铁抽屉，按年份排着。我找到十五年前那一年，又找到上个月。'),
  n('凭证上最后一个调阅人签的是一个保安公司的员工编号：YW-0417。'),
  i('这串号我抄过，就在屿城安保公司的档案室里，第四天那张取消条的经手人一栏。'),
  n('我把凭证翻过来，抬头印着公司名：垣卫安保。法人一栏是个姓季的名字，单名一个垣字。'),
  i('垣，土字旁。'),
  n('我袖口上那半枚章已经描了好几个月，颜色早就淡了。那件外套我一直没洗。'),
  s('jacob','季。'),
  n('他没往下说。他父亲那本笔记的封面上，写的就是一个「季」字。'),
  {p:'凭证在手里。',c:[
    {t:'一个字一个字记下来，原样放回去。',tone:'cold',then:[n('不能抄，凭证室里不能有第二份。我把它放回原处，把抽屉推回去，推到跟别的抽屉一样齐。'),{ev:'voucher'}]},
    {t:'揣走它。',tone:'sharp',then:[
      n('我的手已经伸到口袋边上了。Jacob在我身后轻轻说了一句：「凭证室里少一张，明天就有人知道今晚有人来过。」'),
      n('我把它放回原处，把抽屉推回去，推到跟别的抽屉一样齐。那上面的字，我已经一个字一个字记下来了。'),{ev:'voucher'}]},
  ]},
  {bg:'bg2_dark'},
  n('在出口我碰见了对账人。他站在楼梯底下，没打灯，穿着制服，袖口上有一道新蹭的灰，是档案架边上积了十几年的那种。'),
  s('lu','备用电源的延迟，比条文上写的要长。'),
  i('条文上那个延迟，是当年值夜组定下的规矩，组长是沈眠。这话我没说出口，他也没说。'),
  n('我从他身边走过去。走了两步，他在黑地里又说了一句：'),
  s('lu','别来偷。来还。'),
  n('我停住了。我回过头，他已经往侧廊那边走了，还是没打灯。'),
  {bg:'bg2_street',fx:'none'},
  n('我们在后门跟Hyunjae的车碰头。Eric从副驾驶下来给我们拉开后门，看见我们光着脚，愣了一下，笑了。'),
  s('eric','你们这是去游泳了？'),
  n('我上了车才把鞋穿上，手抖得系不上鞋带，是Jacob替我系的。'),
  RB('c7b'),
  s('hyunjae','拿到了吗？'),
  me('拿到了一个名字，垣卫安保，法人姓季。'),
  n('Hyunjae把车停在路边，熄了火。外面还黑着，整条街一盏灯都没有。他两只手放在方向盘上，放了很久。'),
  s('hyunjae','灰衣服，左胸上绣着一个字，就是这个垣。我端了好几年盘子，会所门口安检的，酒会上站一圈的，我在后厨地上醒过来的时候围着我的，都穿这身衣服，绣的都是这个字。'),
  me('你确定吗？'),
  s('hyunjae','屿城东门那天我就想起来了。当时没说，是因为我拿不准是不是同一个字。现在确定了。回去我做个汤。'),
  {bg:'bg2_noodle'},
  n('那晚Q和Juyeon带回来的消息是，蜡里掺了一种灯油，档城只有一家店卖。店开在西区一条老巷子里，招牌上写着「孟记」。Juyeon在店门口站了一个钟头，看见店里有个年轻人在帮老板搬货，搬到一半停下来，往巷子口看了一眼。'),
  {ev:'oil'},
  s('juyeon','我也说不准他认没认出来。他看的是Q。'),
  s('q','他看我的那个眼神，就是在对一张照片。'),

  s('juyeon','我跟着他。'),
  {bg:'bg2_street'},
  n('他们在十九号对面一家修车铺门口守了三个晚上。New跟修车铺老板借了个板凳，蹲着修一辆旧摩托，修得很慢。Juyeon坐在旁边什么都不干，就看着对面那栋楼。'),
  n('第三个晚上，已经很晚了，二楼的灯还亮着。一个瘦高的老人从楼道里出来，穿着一件洗得发白的外套，走到街口的小卖部买烟，付了钱，用左手接的找零。'),
  n('Juyeon没上前。他站起来跟到巷口，看着老人点了烟，抽了两口就掐了，把剩下的半根放回烟盒里，进了楼道。Juyeon在楼下一直站到灯灭。'),
  s('juyeon','他一根烟只抽一半，留一半。'),
  s('eric','那是什么意思？'),
  s('juyeon','意思是他还在等。'),
  {bg:'bg2_shen'},
  n('第二天，我们把散伙钟抱上二楼，敲了门。钟是Sunwoo从屿城一路抱过来的，用一床旧棉被裹着。那枚〇〇九装在一个小信封里，放在他外套的内袋里。'),
  n('他开门的时候一点也不吃惊。他侧身让我们进去，大概早就算到会有这一天。'),
  n('他比我想的瘦，六十出头，外套洗得发白，左胸口袋上有两个针眼，是别过徽章的地方。屋子很小，一张长桌占了大半，是旧饭桌改的。墙上挂着一口很普通的石英钟，已经停了。'),
  {show:'shen'},
  n('Sunwoo打开棉被，把散伙钟放在长桌正中。沈眠伸出左手在钟壳上摸了一下，摸到底座那道往右拧的蜡封，手指停住了。'),
  s('shen','这不是我封的。'),
  s('q','我们知道。'),

  s('shen','他说一个组十二个人，一个人一年要值四十一个大夜，他就照着这个做的。'),
  s('sunwoo','钟是你弄停的。'),
  s('shen','是我。停在那一天，是想让你们往回看。今天是值夜组散伙整整十五年。停在四十一，是让你们知道是谁。求救有很多种写法，我就会这一种。'),
  s('sunwoo','我爸跟我说，那本册子烧了。'),
  s('shen','他烧的是他那半本，这半本一直在我这儿。他交代过别给你，除非哪天你自己也做了一口这样的钟。现在你做了。'),
  n('Sunwoo没说话。他的手指搭在桌沿上，没有敲。'),
  {bg:'bg2_noodle'},
  n('沈眠起身去厨房烧水，Hyunjae站起来跟了进去。'),
  s('hyunjae','您这儿有面吗？'),
  s('shen','有挂面，没有葱。我不吃葱。'),
  s('hyunjae','我知道。'),
  s('shen','你是陈姨的儿子吧，老金老是管你叫小陈。'),
  s('hyunjae','我姓李，我纠正过他好多回了。'),
  n('沈眠在厨房里笑了一声，很短。Hyunjae煮了一锅挂面，沈眠那碗不放葱，Sunwoo那碗多放辣，其他人碗里各卧了一个蛋。Hyunjae自己那份是最后盛的，直接端着锅吃。'),
  {if:S=>S.flags.likeCilantro===1,then:[n('我那碗边上多搁了一撮香菜，是他从楼下小卖部买回来的。')]},
  {if:S=>S.flags.likeCilantro===0,then:[n('他给我盛面的时候，把香菜碟往旁边推了半寸。')]},
  {bg:'bg2_shen'},{show:'shen'},
  n('沈眠吃得很慢，用左手拿筷子。New坐在长桌拐角上，看着沈眠的左手看了很久，然后低下头。'),
  s('new','沈叔，那个遥控，后来好用吗？'),
  s('shen','好用。你换的那两个触点，一直用到最后一天都没坏。'),
  n('New点点头，低头吃面，吃得很快，被烫了一下也没停。只有Juyeon把自己碗里的蛋夹给了他。'),
  s('shen','你是李广福的儿子。你爸每扇门都要查三遍。那天晚上他也查了三遍，查地下库房那扇门的第三遍时，我就在里面。他没进来，在门口站了一会儿，走了。调查会上他什么都没说，站了一个钟头，被除了名。'),
  s('juyeon','他的档案在哪儿？'),
  s('shen','有一份在我这儿，今天还不能给你。'),

  {p:'',c:[

  s('shen','散在一页被抽走的记录上。'),
  n('十五年前，玉冠存在旧海关库房里，等着认定原主。有人做了一套继承认领的手续，样样都齐，就差一个继承人签字。他们从福利院找了个十六岁的孩子，给了钱，让他签。'),
  s('shen','签字那天晚上是我值班，我看出来了。那孩子拿笔的姿势是小学生那种，大拇指压着食指。那一页要是留着，冠追回来了，进去的只会是他。我抽了。我没想到缺一页也照样能走，只要有人说缺页是值夜组的错。老金，你爸，管器械的，替我扛了大半。后来我看着十二个人变成十一个，最后就剩一把空椅子。'),
  s('sunwoo','他后来每天晚上都睡不着。'),
  s('shen','我知道，我也一样。'),
  n('我问起那颗心。'),
  s('shen','它进馆那天我就认出来了。底座上那两个数的刻法，我在老金那口钟的玻璃罩上见过，是同一个师傅。钢针斜着进去，收笔的时候往上一挑。'),
  i('祖父刻号就是这样。我小时候看他刻过，钢针斜着进去，收笔往上挑一下，他说这一挑是他自己的记号。'),
  s('shen','冠走的每一步都有纸，凭纸出去的，也就能凭一页纸追回来。心就难了，它进门之前来路就洗干净了。系统只认纸，所以它守得住冠，守不住心。从那以后我就不报了，也不拿，辞了职，在中间站着，等一个能认领它的人。'),
  n('他从怀里摸出一张折得很小的纸，放在那枚〇〇九旁边。他做什么都用左手，签字、推东西、端杯子，全是左手。'),

  n('Eric也在看Q。'),
  s('shen','这一页我留了十五年，这是我唯一的退路。我一个人能做的，就是把它交出去。可一交出去，冠是回来了，那孩子的名字也跟着出来了。我等了十五年，就等一个不用交它的法子。'),

  s('sunwoo','我爸知道吗？他知道你要往里面放什么吗？'),
  s('shen','他做那枚销钉的时候就留了空心。他说万一哪天组里有什么东西要藏起来。我还笑他，说我们是值夜的，又不是藏东西的。'),

  {ev:'shenpage'},
  n('Q先下的楼，说是出去透口气。过了一会儿，Eric也下去了。我从窗户往下看，他们两个站在楼道口，隔着两步远。Q在抽烟，他平时是不抽的。一根抽完，Q把烟头掐了扔进垃圾桶，Eric在他背上拍了拍。'),

  n('散的时候，团长留到了最后。他站在沈眠对面，隔着一张长桌，也隔着十五年。'),
  n('他说了一个名字。那个名字我在恒温库的第三张收据上见过。他说得很平，一点起伏都没有。'),
  s('shen','这句话我等了很久。下回再有人问起，别再让别人替你说了。'),

 pre:[

  {bg:'bg2_auction'},

  n('Younghoon给我们做的身份熨得笔挺。我扮一家小藏家的代理人，穿深灰色的西装套裙，领口别着一枚很小的胸针。'),

  s('eric','三个人，两个站着，坐着的那个在喝茶。'),

  n('玉冠压轴，前面拍了很多件。拍到一块怀表的时候，Hyunjae在后排动了一下。我回头看他，他低着头在看自己的手。'),
  n('轮到玉冠了，大屏上投出鉴定记录，来路一栏干干净净，写着九十年代起由私人收藏，传承有序。'),

  {if:'objOk',then:[
    n('他把图录合上推到一边。'),
    s('jiyuan','我们做个交易吧。复审我撤，心脏那一条，你拿着它回家。冠的事你别碰，这一页就到此为止。'),
  ]},
  me('那个侍应长罗德成，你还记得吗？'),
  n('他想了好一会儿才想起这个名字。'),
  s('jiyuan','美术馆辞退他，那是美术馆的事。我只是把一份点名册寄给了他们的人事。他自己交上去的。他那一本，最后一页多写了一行字：第五天，布展工一名，着侍应鞋，未拦。经手人，罗。'),
  s('jiyuan','别人的点名册上都是钩，他自己画的钩比别人的重，他自己写的那一行字，比钩还要重。我只是让该看见的人看见了。'),
  i('我想起第七天，他站在我前面两排，把点名册从胳膊底下拿出来，在最后一页写了几个字。那一行是他自己写的。'),
  s('jiyuan','还有一件事，你可能不知道。你祖父那一万二，借款用途一栏填的是学费。一半交了一个大学生的学费，剩下一半修了半个炉膛。你恨的那份抵债文书是假的，可他欠的钱是真的。你拿回去的东西，有一半是拿你的学费换走的。'),
  n('楼下有人在收椅子，金属腿刮着大理石。'),
  i('那一年我十九岁，在念大二。学费是祖父交的，他说是卖了两件旧作，我没问是哪两件。那年冬天我放假回家，看见棚屋里的炉子修了一半，另一半拿砖头垫着。他说过年再修，可他没等到过年。'),
  n('我看着季垣，他也在看我，看得很仔细，看我的眼睛，看我的嘴角，看我的手。他在等我的脸上起变化。'),
  {ev:'ji_words'},
  {if:'objOk',then:[
    {p:'他在等我的回答。',c:[
      {t:'「交易我不做。复审你递你的，冠的事我递我的。」',tone:'cold',then:[
        n('我没让它变。声音比我想的稳。'),
        s('jiyuan','那就在纸上见吧。你记着，在纸上，我从来没输过。'),
        me('你输过一次。十五年前，缺了一页。'),
        n('他看了我很久。'),
        s('jiyuan','那一页，是别人输的。')]},
      {t:'接过那杯茶。',tone:'soft',set:{tookDeal:1},then:[
        n('我在他对面坐下了。茶是温的，他倒的时候用的是左手边那把壶。'),
        s('jiyuan','心脏那一条，下礼拜就有人送到你手上。'),
        {end:true}]},
    ]}],
   else:[
    s('jiyuan','锤子落了，冠就有了新的来路。那就在纸上见吧。你记着，在纸上，我从来没输过。'),
    me('你输过一次。十五年前，缺了一页。'),
    s('jiyuan','那一页，是别人输的。'),
    {end:true}]},
  {hide:'jiyuan'},
  n('我转身出去的时候，他没起身。门在身后关上了，关得很轻。'),
  {bg:'bg2_auction'},
  n('我往楼下走，走到一半腿才开始抖。'),
  {mini:'steady',arg:{intro:'扶着栏杆站一会儿。栏杆是铜的，很凉。'}},
  RB('c10c'),
  {if:S=>S.flags.route!=='juyeon'||!S.flags.juyeonHand,then:[
    n('团长还在楼梯底下等着。我走到最后一级，他伸手扶了一下我的胳膊肘，很快又松开了。')]},
  n('对账人站在楼梯口，穿着便服，手里刚被人塞了一份文件。暂停职务变成了正式立案调查，他再也没法以稽查的身份拦任何人了。'),
  s('lu','你们那一页，我还没找到。'),
  me('我知道。缺页的人，往往就是补页的人。'),
  n('他看了我一眼，走了。走到大门口，他在第一级台阶上停了停，回头往大厅里看。'),
  {bg:'bg2_station'},
  n('回去的车上，Kevin坐在我旁边。车开出去很远，他忽然开口。'),
  s('kevin','他说的那个关员，抱着匣子出来、一眼都没敢看他的那个，就是我爸。我爸的日记里写了那一天。季家那条船，玉冠一件，扣。下面一行是后来补上去的：儿子在码头上看着我，我没敢看他。'),
  me('后面还写了什么？'),
  s('kevin','后面我没看。我打开过好几回，每次都停在这一页。他刚才说那句话的时候，包厢的门没关严，我在楼下都听见了。'),
  n('他没再说别的。车窗外面，档城的路灯一盏一盏往后退，Hyunjae开得很慢。'),
  n('那天夜里，我把季垣说的话一句一句写进了本子，罗德成那一行，学费那一行，「纸上见」那一行。写完了，我在每一行后面都留了经手人的格子，在那一栏里写上了自己的名字。'),
  ...note('季垣 · 包厢里的话',3),
 ],
 next:'c11'};

/* ---------------- 十一　偷，还，烧 ---------------- */
P.c11={label:'十一 · 偷，还，烧',dayLabel:'十一',time:'夜',place:'面馆楼下 · 长桌',card:'偷，还，烧',cardSub:'十一',bg:'bg2_noodle',goal:'三个选项摆上了长桌。',
 pre:[
  n('这张长桌是住处楼下那家面馆借给我们的，老板娘收摊以后让我们用，条件是用完把凳子摆回去。桌上还留着一层没擦干净的油，Hyunjae擦了好几遍。'),
  n('偷：玉冠撤拍了，待核期间存在拍卖行的库房里。趁乱转手换钱，散伙照旧。'),
  n('还：走归还程序。可原主已经没了，原受托方是旧海关库房，十五年前就撤了编制。得有个人站出来，以原受托方的名义受领，还得有证人。'),
  n('烧：把档城里关于我们的一切记录，连同复审卷，想办法一把火了结。换电夜那条路还通着。从此干干净净，也从此没了来路。'),
  n('我把三个选项写在白板上，写完站到一边。这一次是团长先表态。'),
  s('leader','我烧过一次名字。烧完了才知道，烧掉的东西并不会没，它会变成债，利滚利地涨。'),
  s('jacob','原件还活着，我父亲那笔账总算有机会开口了。'),
  n('他也不投烧，把那只胸牌从衣服上摘下来，正面朝上放在桌上。'),
  RB('c11a'),
  s('hyunjae','要是偷了，咱们这一个月吃的锅贴算谁的？'),
  n('大家笑了，他投了还。'),
  s('hyunjae','那家锅贴店的老板娘说，她小时候在旧海关对面那条巷子里吃过一家大排档，我没告诉她那是我妈开的。'),
  s('q','我没干过的那三件事，得有人在明面上替我说清楚。还有一件我干过的，也得摆在明面上。'),
  s('eric','要是烧了，我那张照片也就没了。拍得还挺好的，我舍不得。'),
  s('juyeon','我爸每扇门都要查三遍。'),
  n('Younghoon一句话没说就投了还。投完他把那本借名簿从包里拿出来放在桌上，压在自己手底下。'),
  s('sunwoo','想偷也偷不了。冠在拍卖行的库房里，库房的锁是垣卫装的，装锁的人肯定留了一根弹簧。'),
  me('你怎么知道？'),
  s('sunwoo','我要是他，我也会留。'),
  n('New没说话，跟着投了还。Kevin是最后一个。'),
  s('kevin','我爸扣下了它。扣得对不对，扣不扣得住，他在日记里自己问过自己。我替他答一回吧。'),
  n('轮到沈眠，他站了起来。他是Juyeon和New请来的，来的时候穿着那件洗得发白的外套，口袋上有两个针眼。他是外人，没有票，可谁也没拦他。'),
  {show:'shen'},
  s('shen','我以证人身份，自陈旧案。十五年前那页记录是我抽的。我抽它，是因为签字的人里有一个不该签的人，是个孩子。名字我不说。'),
  n('他解下那枚旧徽章，放在桌上。团长看着那枚徽章，右手慢慢地挪过去，攥住了左手的手腕。'),
  s('leader','你不说，复审也会问。'),
  s('shen','问了我也不说。那个名字你自己已经说过了。你要是还想说，就在你想说的地方说，别在这儿。'),
  {hide:'shen'},
  n('我看着那枚徽章。手里还有两枚棋子。'),
  {p:'两枚棋子，推到哪一个字上？',c:[
    {t:'偷',tone:'sharp',set:{triedSteal:1},then:[
      n('我把棋子往「偷」那边推了一格。Sunwoo伸手按住了。'),
      s('sunwoo','我刚才说了，库房的锁留着一根弹簧。你推过去，就是往那根弹簧上推。'),
      n('他把棋子推回我手边。')]},
    {t:'还',tone:'cold'},
    {t:'烧',tone:'sharp',set:{burn:1}},
  ]},
  S=>S.flags.triedSteal?[{p:'棋子回到我手边。',c:[{t:'还',tone:'cold'},{t:'烧',tone:'sharp',set:{burn:1}}]}]:[],
  {if:'burn',then:[
    n('我把两枚棋子推到了「烧」上。长桌上没有人说话。团长看着我，看了很久，没有拦。'),
    {end:true}]},
  n('我把手里的两枚棋子推到了「还」上。'),
  {bg:'bg2_post'},
  n('然后我去找了复审员。复审办在档案馆群东头的一栋小楼里，三楼，走廊很长。复审员桌上摊着我交上去的那卷行动记录，封面上那行字被她用红笔圈了起来。'),
  {show:'rev'},
  s('rev','记录不全，另有半页在别人手里。你上回说，一半在一个借你名字的人那儿，一半在一个还没准备好说出自己名字的人那儿。现在准备好了吗？'),
  me('还没有。可是有一个证人准备好了。'),
  s('rev','你知道这样做，复审的重心是挪不开的，你们的行动记录还在卷里，一页都不会少。那你图什么？'),
  {p:'',c:[
    {t:'「程序是用来站的，我不想拿它来躲。」',tone:'cold',tr:{leader:1}},
    {t:'「我知道。」',tone:'soft'},
  ]},
  n('她低下头，在那卷记录的封面上、红圈旁边写了一行小字，我看不见她写了什么。复审期就这样变成了公证期。'),
  {hide:'rev'},
  n('公证那天沈眠去了。他坐在公证员对面，用左手签了字。签完他放下笔，把那枚徽章推过去，作为附件登记。'),
  s('shen','是值夜组的，十二个人一人一枚，这一枚是我自己的。其他十一枚，处分那天都收回去了，一个一个收的。'),
  n('公证员在登记表上写：附件一，徽章一枚，原值夜组组长配发。她落笔的时候，玉冠的归还程序也正式打开了。'),
  n('归还程序最后还剩一道手续，移交。得有一个人进拍卖行的库房，把它一项一项核出来，签字交到接收方手里。'),
  {p:'移交那一栏，执行人写谁？',c:[
    {t:'Q',tone:'soft',set:{executor:'q'},then:[s('q','我？'),me('你这辈子开了那么多扇门，这一扇，你正正经经地开。'),n('他没再推。')]},
    {t:'团长',tone:'cold',set:{executor:'leader'},then:[s('leader','行。')]},
    {t:'我自己',tone:'cold',set:{executor:'me'}},
  ]},
  n('我交上去的原主申请，受益人一栏写的是：档城旧海关库房，由该库最后一任值夜组长代为受领。'),
  {mini:'sign',arg:{id:'c11',text:'档城旧海关库房，由该库最后一任值夜组长代为受领。',intro:'申请人一栏，签我自己的名字。',tremble:1}},
  i('签到最后一笔，我的手抖了一下。落在纸上的是我自己的名字。'),
  s('shen','我早就不是组长了。'),
  me('册子上你是最后一任。册子上可没写你不是。'),
  n('他没再说什么，在受领人一栏签了字，字是一笔不省的那种。'),
  n('出了公证处，他在台阶上站了一会儿，摸出烟盒抽出一根点上。这一回他没掐，一直抽完了。'),
  ...note('原主申请 · 受领人',1),
 ],
 next:'c12'};

/* ---------------- 十二　上弦 ---------------- */
P.c12={label:'十二 · 上弦',dayLabel:'十二',time:'傍晚',place:'屿城 · 仓库',card:'上　弦',cardSub:'十二',bg:'bg2_noodle',goal:'第十二格。',
 pre:[
  n('三条线在同一个月里合到了一起。'),
  n('复审通过了。认定书写得很长，最短的一句是：心脏原认定维持；另查明，玉冠初次移交记录存在人为缺损，缺损责任另案处理。'),
  n('另案处理，我把这四个字抄进了本子，经手人那一栏空着，我不知道该写谁。'),
  n('认定书的附件里，那三份材料都还在，第七天的报警记录，Eric的滋扰登记，老纪的通报。复审员在每一份后面都加了一行注：经查与本案认定无直接关联，不予采信。不予采信，并没有撤销。'),
  RB('c12a'),
  n('模仿者落网了。他姓孟，三十出头，是垣卫安保的前雇员。五年前对账人稽查垣卫，账对不上，垣卫开除了几个基层员工顶罪，他就是其中一个。'),
  n('Kevin默写出来的那些调阅里，有一次的编号跟凭证室那张借阅凭证是连号的。Q和Juyeon追的那种灯油，档城只有一家铺子卖，铺子是他父亲开的，孟记。'),
  n('分局让Q去认人。隔着一面单向玻璃，那个年轻人坐在审讯室里低着头，右手食指上有一道烤蜡时烫出来的疤。'),
  s('cop','他学了两年，是对着十年前那桩案子卷宗里的照片练的。照片是反着洗的，他一直都不知道。'),
  s('q','他的手很稳。他从来没想过要把谁关在里面，所以才不封退路。'),
  n('Q去分局撤了自己的当事人登记。窗口的人说可以撤，可登记过的记录删不掉，只能加注「已排除」。Q说行，签了字，又按了一回手印。'),
  n('Q出来的时候手上还是沾着印泥，这一回他没往裤子上擦。他看了一会儿自己的手指，然后把手插进了口袋。'),
  n('老纪的装订室没有还回来。处理决定上写的是提前退休，退休是撤销不了的。新来的装订工是个二十多岁的年轻人，在装订室门口摆了一盆绿萝。老纪一次也没去看过。四个搪瓷杯摆在饭桌上，Juyeon那条围巾还搭在椅背上，他没还，也没围。'),
  n('对账人的立案调查还没有结论。他没辩解，只说那份卷宗是他转的，转的时候就知道违规。'),
  n('罗德成我还是没找到。我给美术馆人事科写了一封信，问他的去向，说想当面跟他道个歉。回信说离职人员信息不予提供。我把回信夹进本子，在第一页那一行后面添了半行：他自己写的。'),
  n('案子后面还挂着别人的名字，屿城第四天那半枚土字章，档城凭证上的那个编号，还有二楼包厢里那个说「纸上见」的人。那一页，留给明年。'),
  RB('c12b'),
  {if:S=>H.avg(S)<5,then:[{end:true}]},
  {bg:'bg2_clock'},
  n('最后一件事，是上弦。我们回了屿城。仓库还是那间仓库，长桌还是那张长桌。第十二把椅子还在墙角，椅背上搭着一块干净的布。'),
  n('Sunwoo把沈眠那张纸卷成细细的一条，往〇〇九的空心里塞。他卷得很慢，头几回都卷松了，散开了，他就重新卷，直到卷紧了，才推进销钉里，把销钉装回第十二格。'),
  s('sunwoo','等这一格上满了，销钉一转，纸就会掉进底座的夹层。那个夹层没有出口，想拿出来就只能砸钟。那时候还没有，是从档城回来以后加的。我爸给那根销钉留了空心，我就给它留个底。'),
  n('钟摆在长桌上，我们排成一排，一人上一格。'),
  n('Eric先上。他一边拧一边小声数，数满了正好上满，然后退到一边。Jacob上的时候胸牌正面朝外，弯腰时碰到了钟壳，叮的一声。'),
  s('kevin','有一道比别的刻得深一点。'),
  s('sunwoo','那道我重刻过。'),
  n('Juyeon上得最慢，一圈一圈地拧，生怕弄疼了它。Younghoon上完，从口袋里拿出一张很小的纸，折好，塞进了钟座下面的缝里。没人问他画的是谁。'),
  n('New上之前先蹲下来看了一眼底座的螺丝，把它拧紧了半圈。Hyunjae上完，顺手在钟壳上擦掉了一个油指印，是锅贴留下的。Q上完，重新封了蜡，往左拧着收的尾。'),
  n('团长上的时候两只手都扶在钟上。他上得很稳，上完退后一步，把手背到了身后。'),
  n('十一格都满了，只剩下第十二格。所有人都看着我，只有团长看着那口钟。'),
  {mini:'wind',arg:{intro:'我去拉那一格的弦。我的手很冷，弦很紧。'}},
  n('销钉转了半圈，夹层里很轻地「嗒」了一声。我没去看它落到了哪儿，只看着钟摆摆过去，又摆回来。'),
  {sfx:'tick'},
  {show:'lu'},
  n('对账人来了。他坐了一夜的慢车，站在门口，穿着一件没有肩章的制服，手里拎着那本册子，没进来。他看着那口钟走满十二格，从口袋里拿出一张折好的纸展开，夹回他那本册子里，合上了。'),
  n('我看见了那张纸的边，白的，很新，跟册子封皮内侧那一截撕剩的纸边正好对得上。'),
  s('lu','对上了。'),
  s('hyunjae','路上吃吧，我做的。'),
  n('对账人看着那个饭盒，接了过去。'),
  {hide:'lu'},
  n('沈眠没有来。第十二把椅子上放着那台旧对讲机，是我们离开档城那天他托葛转交给New的。New修好了，换了电池，开着，调在那个公共频道上。'),
  {sfx:'radio'},
  {radio:'……'},
  n('它最后亮了一次，只有电流声。电流声的深处有一句话，很轻，听上去说话的人终于可以躺下了。'),
  n('我们都没听清那句话是什么。Sunwoo说他听清了，可他不肯说。'),
  n('那天晚上Sunwoo趴在长桌上睡着了，手指搭在桌沿，一下都没敲。Hyunjae拿了一件外套盖在他身上，Juyeon去关了门，把门把拉了三次。'),
  {mini:'names',arg:{intro:'经手人那一栏，写下十二个名字。'}},
  n('我在本子上记了最后一笔。经手人那一栏，我写了十二个名字，最后一个写的是沈。'),

/* ---------------- 声音：档城的几个动机 ---------------- */
const tone1=(c,t,AU,fq,dur,vol,type,at)=>{ const o=c.createOscillator(),g=c.createGain(); o.type=type||'sine'; o.frequency.value=fq; g.gain.setValueAtTime(.0001,t+(at||0)); g.gain.linearRampToValueAtTime(vol,t+(at||0)+.02); g.gain.exponentialRampToValueAtTime(.0001,t+(at||0)+dur); o.connect(g); g.connect(AU.sfx); o.start(t+(at||0)); o.stop(t+(at||0)+dur+.05); };
const noise=(c,t,AU,f,q,dur,vol)=>{ if(!AU.noise) return; const s=c.createBufferSource(),bf=c.createBiquadFilter(),g=c.createGain(); s.buffer=AU.noise; bf.type='bandpass'; bf.frequency.value=f; bf.Q.value=q; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur); s.connect(bf); bf.connect(g); g.connect(AU.sfx); s.start(t,Math.random()*2,dur+.05); };
E.SFX_EXT=Object.assign(E.SFX_EXT||{},{
  pen:(c,t,AU)=>{ noise(c,t,AU,4200,1.2,.18,.18); noise(c,t+.12,AU,3600,1.2,.12,.12); },
  gavel:(c,t,AU)=>{ noise(c,t,AU,180,.7,.25,1); tone1(c,t,AU,110,.3,.12,'triangle'); },
  ratchet:(c,t,AU)=>{ for(let k=0;k<5;k++) noise(c,t+k*.05,AU,2400,4,.03,.25); },
  breath:(c,t,AU)=>{ if(!AU.noise) return; const s=c.createBufferSource(),bf=c.createBiquadFilter(),g=c.createGain(); s.buffer=AU.noise; bf.type='lowpass'; bf.frequency.value=700; g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(.12,t+.9); g.gain.linearRampToValueAtTime(.0001,t+2.2); s.connect(bf); bf.connect(g); g.connect(AU.sfx); s.start(t,Math.random()*2,2.3); },
  /* 档城动机：A小调五声，四个音，最后一个落在钟上 */
  motif:(c,t,AU)=>{ [[440,0],[523.25,.22],[392,.44],[329.63,.7]].forEach(([f,a])=>tone1(c,t,AU,f,.9,.06,'triangle',a)); tone1(c,t,AU,1318.5,1.4,.025,'sine',.7); },
});
let motifT=null;
E.AMB_EXT=function(kind,AU){
  clearInterval(motifT); motifT=null;
  if(kind!=='archive'||!AU.ctx) return;
  /* 档城的街：低处一层很轻的长音，隔一阵响一句动机的前两个音 */
  const play=()=>{ const c=AU.ctx,t=c.currentTime; tone1(c,t,AU,220,3.2,.018,'sine'); tone1(c,t,AU,440,1.6,.012,'triangle',.6); tone1(c,t,AU,523.25,1.8,.01,'triangle',1.1); };
  play(); motifT=setInterval(play,11000);

/* 番外桥章 ·《中间那一年》：第二章结算后、第三章之前。可跳过。 */
(function(){
const E=window.ENGINE, h=window.__CH1H||window.__CH2H;
const s=(w,t)=>({s:w,t}), n=t=>({n:t}), i=t=>({i:t}), me=t=>({me:t});
const MEM=['leader','sunwoo','hyunjae','juyeon','younghoon','q','new','kevin','jacob','eric'];

const P={};
P.m0={label:'中间那一年',dayLabel:'冬',time:'冬',place:'屿城 · 仓库',card:'中间那一年',cardSub:'番外 · 上弦之后',bg:'bg_warehouse',
 pre:[
  n('上弦那晚，钟走满了十二格。第二天大家各回各家。正篇里这段日子是空的。上弦在十一月底，对账人来敲门已经是第二年开春，满打满算三个来月。说是一年，其实只是跨了一个年。'),
  n('那段日子里大家只做些手边的小事，修修补补，吃吃喝喝，一天接着一天就那么过下来了。'),
  {p:'这段冬天，要不要走进去看一眼？',c:[
    {t:'走进去。',tone:'soft',then:[]},
    {t:'先跳过，等第三章。',tone:'cold',then:[
      n('那一年就先搁在这里。标题页的「番外」里以后还能回来。'),
      {set:{midSkipped:1}},{softEnd:1,unlock:'midyear'}]},
  ]},
 ]};
P.m1={label:'一月',dayLabel:'一',time:'夜',place:'屿城 · 仓库',card:'一　月',cardSub:'中间那一年',bg:'bg_warehouse',
 pre:[
  n('一月最冷那几天，仓库漏雨了。说漏也不准确，是渗。雨水从铁皮顶上一道很细的缝里渗进来，顺着墙内侧往下流，在墙角积出一小洼。滴得很慢，可夜里静，一屋子人都听得见。'),
  {show:'hyunjae'},
  s('hyunjae','这声儿跟秒针一样，听得人心慌。'),
  n('那天夜里仓库里有好几个人，有人打牌，有人睡觉，有人就那么坐着。到了后半夜，Hyunjae搬了把椅子到墙根底下，仰头盯着那个渗水的地方。'),
  me('你这是干什么呢？'),
  s('hyunjae','我想看看要滴多久才能积出这么一洼。'),
  n('后来Eric也过来了，坐在他旁边一起看，两个人还打起赌来，赌天亮前那一洼能不能漫到桌腿。最后谁也不服谁，就一起仰着头盯着那道缝，一直盯到天亮。'),
  {show:'new',side:'r'},
  n('第二天New带着工具来，爬上去补了一会儿就补好了。他从梯子上下来。'),
  s('new','你们怎么不早说啊？'),
  s('hyunjae','说了，昨天你没来。'),
  s('new','我昨天在修对讲机。'),
  s('hyunjae','我知道。'),
  s('new','那你怎么不给我打个电话？'),
  n('Hyunjae没答。他蹲下来收拾那一小片湿地板，拿地上的旧报纸擦。'),
  i('我在旁边看着。我大概知道他为什么不打，没说出来。'),
  n('从那天起，团里定了个规矩，谁有事就在群里说一声。'),
  n('规矩定下的第二天，群里头一条是Hyunjae发的：「明天吃锅贴。」接着Kevin发：「明天降温。」再往下是Sunwoo：「钟慢了，谁动过？」'),
 ],next:'m2'};
P.m0.next='m1';

P.m2={label:'二月',dayLabel:'二',time:'午后',place:'屿城 · 仓库',card:'二　月',cardSub:'中间那一年',bg:'bg2_clock',
 pre:[
  {show:'sunwoo'},
  n('二月，Sunwoo教所有人调钟。散伙钟上满了，谁也不许再碰，他教的是普通的钟。他说这世上坏了没人修的钟太多了，「你们至少得知道怎么上弦。」'),
  n('他搬了一排钟摆在长桌上，从小到大排好，每口钟前面放一把小螺丝刀，一把镊子，一张纸。'),
  s('sunwoo','先学听，都别说话。'),
  n('我们就那么坐着听。那几口钟各走各的，有快的，有慢的，有的走得很匀，有的磕磕绊绊，最响的那口听上去有人拿指头在敲桌子。'),
  s('sunwoo','听出来了吗？'),
  me('听出什么来？'),
  s('sunwoo','每口钟的毛病都不一样。钟一走得不顺，声音就会变。它自己不会说话，可它响的时候会漏掉一点东西，你们要找的就是漏掉的那一点。'),
  n('他给每口钟都起了名字，写在纸上。走得快的那口叫「急」，有时候会停的那口叫「睡」。'),
  me('为什么叫这个？'),
  s('sunwoo','你们自己听出来就知道了。'),
  n('我们听了快一个钟头，Eric忽然举起手，指着最小的那口说：「这一口的毛病跟快慢都没关系，它走着走着会漏掉一声。」'),
  s('sunwoo','对，那你来修。'),
  n('Eric吓得往后一缩。那天晚上，所有人都上手修了一遍。有人修好了，有人修坏了，有人修到一半不敢动，把螺丝刀还了回去。'),
  n('修坏的正是Eric那一口。Sunwoo也不生气，把钟翻过来，指着底下一行小字。'),
  s('sunwoo','〇一七，这是我做的头一口钟，是给我爸做的。'),
  s('eric','那你还让我修？'),
  s('sunwoo','我不让人修它，它就一直坏着。东西坏了我倒不怕，我最怕的是坏了以后再没人去碰它。'),
  n('他把〇一七拿回去拧了两下，又推回Eric面前。'),
  s('sunwoo','接着修吧，我在旁边看着。'),
 ],next:'m3'};

P.m3={label:'三月',dayLabel:'三',time:'夜',place:'屿城 · 仓库',card:'三　月',cardSub:'中间那一年',bg:'bg_warehouse',
 pre:[
  n('三月里有一件小事，只有Kevin记得清楚。'),
  n('那天我们打牌，分了两桌。打到半夜，有人吵了起来，为的是到底有没有出过一张牌。吵得最凶的是Juyeon和Jacob。Juyeon说话慢，Jacob说话快。吵到后来，两个人都不说了，屋里静了一会儿。'),
  {show:'juyeon'},
  s('juyeon','你不该出那么快。'),
  {show:'jacob',side:'r'},
  s('jacob','那是在打牌。'),
  s('juyeon','打牌也是你的手在动。'),
  n('这话谁也没听懂，连Juyeon自己都说算了，牌接着打。'),
  n('第二天Kevin跟我说，昨晚有几处变化，我们都没注意到。'),
  {show:'kevin'},
  s('kevin','Juyeon吵完一直站在门边，Jacob把表摘了放在桌上。我看他们俩都没真生气，就是累了，随时想走。'),
  s('kevin','还有你，散场的时候你坐到中间来了。'),
  me('你连我也在看？'),
  s('kevin','看惯了。干我们这行的毛病，你别介意。'),
  me('那我坐到中间，说明什么？'),
  s('kevin','说明你不想再站在外头了。'),
  n('我没说话。'),
  i('那天晚上回去，我想了很久。我想起第一季进门那天，我站在最远那把椅子旁边，不敢坐；想起散伙钟停的那一夜，我是最后一个走的，在楼道里站了很久；想起拍卖夜，我一直站在楼梯上。我确实一直在往外站。'),
  {p:'第二天，长桌中间那把椅子空着。',c:[
    {t:'坐到中间去。',tone:'soft',tr:{kevin:1},then:[
      n('第二天，我在长桌中间坐下了。Kevin在门边看见了，什么也没说。'),{set:{midSat:1}}]},
    {t:'还是坐边上。',tone:'cold',then:[
      n('我还是坐在边上。Kevin看了一眼，没劝。')]},
  ]},
 ],next:'m4'};

P.m4={label:'各自',dayLabel:'冬',time:'冬',place:'屿城 · 仓库',card:'那个冬天',cardSub:'各自在做什么',bg:'bg_warehouse',
 pre:[
  n('那个冬天他们各自在做着小事。'),
  n('团长在学用手机，是真学，学了一整个冬天，一开始连语音都不会发，后来会了。他发的头一条语音是给Hyunjae的，就一句「明天吃」，Hyunjae回了他一个句号。'),
  n('Juyeon把团里那辆旧面包车的后厢收拾了一遍，铺了木板，钉了挂钩，备了一捆绳子和一床毯子。他说万一有人要躺着呢。'),
  n('Hyunjae天天记账，那本账记得极细，连谁欠谁一包烟都记上了。记到后来他发现，这伙人互相欠来欠去，最后谁也不欠谁。'),
  n('Q那截红蜡快用完了，只剩指甲盖那么一小截。他没买新的，说用完了就不玩了，可那一小截一直揣在他兜里，始终没用完。'),
  n('Sunwoo睡不着就画钟，画的是小孩子画的那种，一个圈，两根针，底下一根柱子。他画了厚厚一沓，都塞在一个信封里。'),
  {if:S=>S.flags.nightOwl===1,then:[n('有几回我半夜还醒着，仓库灯一亮，就看见他也在。')]},
  {if:S=>S.flags.nightOwl===0,then:[n('我那阵子倒是睡得着，只有偶尔醒一回，才听见他在长桌那边翻纸。')]},
  n('New在教Eric修收音机，那是他爷爷传下来的老手艺。他教得极严，从接线的顺序教起，Eric学了两个礼拜才拧上一颗螺丝。'),
  n('Kevin在记那本「站着的位置」，已经记满了一本，最后一页空着，他说要留着。'),
  n('Jacob学会了一道菜，番茄炒蛋。他做了好多回，前面大半都糊了。终于做成的那一回，他端了一盘到仓库，全团都吃了。Hyunjae说了一句「能吃」，他高兴了好几天。'),
  n('Eric开始记日记。他的日记里没有事，只记今天留意了哪些东西，一样一样列下来。'),
  {p:'那个冬天，你最常去找谁？',c:[
    {t:'团长',tone:'soft',tr:{leader:1},then:[{set:{midWho:'leader'}}]},
    {t:'Sunwoo',tone:'soft',tr:{sunwoo:1},then:[{set:{midWho:'sunwoo'}}]},
    {t:'Hyunjae',tone:'soft',tr:{hyunjae:1},then:[{set:{midWho:'hyunjae'}}]},
    {t:'Juyeon',tone:'soft',tr:{juyeon:1},then:[{set:{midWho:'juyeon'}}]},
    {t:'Younghoon',tone:'soft',tr:{younghoon:1},then:[{set:{midWho:'younghoon'}}]},
    {t:'换一排人看看',tone:'cold',then:[
      {p:'那个冬天，你最常去找谁？',c:[
        {t:'Q',tone:'soft',tr:{q:1},then:[{set:{midWho:'q'}}]},
        {t:'New',tone:'soft',tr:{new:1},then:[{set:{midWho:'new'}}]},
        {t:'Kevin',tone:'soft',tr:{kevin:1},then:[{set:{midWho:'kevin'}}]},
        {t:'Jacob',tone:'soft',tr:{jacob:1},then:[{set:{midWho:'jacob'}}]},
        {t:'Eric',tone:'soft',tr:{eric:1},then:[{set:{midWho:'eric'}}]},
      ]}]},
  ]},
 ],next:'m4b'};

/* 那个冬天你常去找谁：十段短场景，一次只看一段 */
const W=(k,steps)=>({if:S=>S.flags.midWho===k,then:steps});
P.m4b={label:'那个冬天',dayLabel:'冬',time:'夜',place:'屿城',card:'常去找的人',cardSub:'中间那一年',bg:'bg3_winter',
 pre:[
  W('leader',[{show:'leader'},
    n('团长学会发语音以后，头一条发给了Hyunjae，第二条发给了我。我点开听，是四十多秒的风声，中间夹着一下很轻的咳嗽。'),
    me('你发了一段风过来，是想跟我说什么？'),
    s('leader','我按住了想说话，结果一直没想好说什么，手一松就发出去了。你就当我在门口站了四十秒吧，我平时站在门口也就是这个样子。'),
    n('后来他又发过几回，每回都比上一回短一点。最后那一条只有两秒，我听了好几遍才听清，是我的名字，他叫得很快，叫完立刻松了手。')]),
  W('sunwoo',[{show:'sunwoo'},
    n('Sunwoo那一沓钟都塞在信封里，他不让人看。有一回我去仓库早了，他正趴在桌上画，看见我进门，也没把纸收起来。'),
    s('sunwoo','你来得正好，帮我看看这一张画得像不像钟。我画了一冬天，越画越像小孩子画的，自己都快认不出来了。'),
    n('纸上一个圈，两根针，底下一根柱子。针指的是九点十分，正好是我推门进来的时间。'),
    me('你这是现画的吧？'),
    s('sunwoo','顺手而已，你别多想。这张归你了，挂在哪儿都行，就是别挂在我看得见的地方，我怕我忍不住要去改。')]),
  W('hyunjae',[{show:'hyunjae'},
    n('Hyunjae教我包锅贴，说是冬天手冷，揉面正好暖手。我包的第一个漏了馅，第二个立不起来，他全收进自己那一盘，说这几个他包圆了。'),
    s('hyunjae','你别心疼，漏馅的煎出来最香，汤汁全流到锅底，结成一层脆的，我小时候就专门挑这种吃。'),
    {if:S=>S.flags.likeCilantro===1,then:[s('hyunjae','蘸料里我给你多搁了香菜，你那天说要加的，我没忘。')]},
    {if:S=>S.flags.likeCilantro===0,then:[s('hyunjae','蘸料里的香菜我单独盛了，你不爱吃就别沾到。')]},
    n('那天他在账本上记了一笔：某月某日，欠我锅贴零个。我问他记这个干什么，他说账要记全，零个也是一笔。'),
    s('hyunjae','这样等哪天你欠我的时候，前面已经有一整页了，看着就没那么吓人。')]),
  W('juyeon',[{show:'juyeon'},
    n('Juyeon把面包车的后厢收拾好以后，问我要不要坐一趟试试。我们在城里慢慢绕了一圈，他开得很慢，过每个路口都先停一下再走。'),
    s('juyeon','后面那床毯子是给你备的。你上回在车上睡着，脑袋一直往车窗上磕，我听着都替你疼。'),
    n('绕到海边那条路，他把车停在路边，熄了火。外面什么也看不清，只听得见浪一下一下拍上来。'),
    s('juyeon','我也说不好为什么要停在这儿。就是觉得这一年过得挺快的，想慢一点，你要是困了就先睡，我不急着回去。')]),
  W('younghoon',[{show:'younghoon'},
    n('Younghoon那个冬天在拍仓库，拍漏雨的墙角，拍长桌上的扑克，也拍空着的椅子。他说照相馆关了以后，他好几年没碰过相机了。'),
    s('younghoon','你能站到门口那儿去吗？不用看我，你就照平常那样站着，想往哪儿看就往哪儿看。'),
    n('我在门口站了一会儿，他一直没按快门。后来我转头去看外面下雨，听见身后咔嚓一声。'),
    s('younghoon','就是刚才那一下。你平时站在门口都在想事，我等了一冬天，才等到你什么都没想的时候。')]),
  W('q',[{show:'q'},
    n('Q兜里那一小截红蜡始终没用完。他坐在仓库角落，教我开一把最便宜的挂锁，说这一把用不着工具，靠手感就行。'),
    s('q','你别使劲，越使劲越听不见它在说什么。往里推一点，转一点，等它松一下，那一下很轻，你得先学会等。'),
    n('我试了一晚上，快十二点的时候，锁扣终于弹开了。他听见那一声，嘴角动了一下，把那把锁连同钥匙一起塞进我手里。'),
    s('q','送你了。以后你要是被锁在哪儿，先别急着喊人，想想今天晚上。')]),
  W('new',[{show:'new'},
    n('New教Eric修收音机，我搬了把椅子坐在旁边看。Eric拧了两个礼拜才拧上一颗螺丝，New一句也没催，等他拧好了，才把下一颗递过去。'),
    s('new','你也来试试吧，别光看着。从左上那颗开始拧，我爷爷就是这么教我的，他说顺序乱了，零件会记仇。'),
    n('我拧完一颗，New伸手摸了摸，说松了一点，又让我回半圈。那台收音机后来真响了，响的头一句是天气预报，说明天降温。'),
    s('new','你听，它也学会关心人了。这一台算你半个徒弟的作品，回头我在后盖上给你刻个记号。')]),
  W('kevin',[{show:'kevin'},
    n('Kevin那本「站着的位置」记满了，他给我看过其中一页。那一页画的是仓库的平面图，长桌、门和窗户都在，上面用铅笔点了很多小点，一个点旁边写一个日期。'),
    s('kevin','这些点都是你。你看，进门头一个月你都站在这儿，离门一步。后来是这儿，再后来到了桌子边上。我画着画着就发现，你每个月都往里挪一点。'),
    me('那你自己呢？你画了没有？'),
    s('kevin','我还在门边。不过我也在练了，你往里挪一步，我就跟着挪半步，这样不会挪太快把自己吓着。')]),
  W('jacob',[{show:'jacob'},
    n('Jacob那道番茄炒蛋炒糊了好几回，最后一回我在旁边帮他看着火。他把鸡蛋打进碗里的时候特别认真，连蛋壳的碎片都要用筷子挑干净。'),
    s('jacob','火小一点，我每回都是在这一步上糊的。我爸以前说做饭跟签字一样，下手太快就收不回来了，我那时候以为他是在讲做饭。'),
    n('那一盘终于没糊。他端到仓库，Hyunjae尝了一口，说能吃。Jacob背过身去收拾锅，耳朵红了好一阵。'),

    s('eric','你每次都把伞立在门后，伞尖朝左。我原来以为这种事只有我会记，后来发现Kevin也记，我们俩比了一回，还是他记得多。'),

  n('中午雪果然化了，台阶上只剩一片湿印子。Juyeon拿扫帚把门口扫了一遍，扫完又把扫帚靠回门后，伞的旁边。'),

  n('他后来说，那一刻他最想做的是一件很蠢的事，坐下来，把脸埋进手里，睡一会儿。他已经十五年没睡过一个整觉了。'),

(function(){
const E=window.ENGINE;

  {card:'一笔旧账',sub:'三个长夜 · Q'},
  {bg:'bg2_dark'},
  n('Q十九岁那年进去过一回。有人雇他开一个档案柜，活儿不难，开完就走，给的钱也不多。他那天犯了个错，没封退路。'),
  n('这一行有个规矩，开锁的人要从里面把退路封好，谁追进来，都得先撞上他，不能撞上雇主。那天他也说不清是忘了还是懒，总之没封。'),
  n('后面有人追了进来，是个穿灰制服的保安，跑得很快。两个人在楼梯间里一路追，追到转角，那人一脚踩空摔了下去，摔断了腰。'),
  n('Q站在楼梯上往下看，那人躺在底下一动不动，嘴里还在出气。他没有跑。他下去把人抱住，扯着嗓子喊人来。'),
  n('后来他被抓了。审的时候问是谁雇的，他说不知道，他是真不知道。判了三年。'),
  {bg:'bg_corridor'},
