<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>偷心行动 · 完整版（在线版）</title>
<style>
  html,body{margin:0;height:100%;background:#05070b;color:#f3ead7;
    font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#05070b}
  #stage{position:relative;width:1280px;height:720px;transform-origin:center center;
    background:#0b0f16;box-shadow:0 0 80px #000;overflow:hidden}
  iframe{position:absolute;inset:0;width:1280px;height:720px;border:0;display:block;background:#0b0f16}
  #veil{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:#05070b;z-index:9;transition:opacity .6s;font-size:14px;letter-spacing:.2em;color:#8b7f66}
  #veil.gone{opacity:0;pointer-events:none}
  #rotate{display:none;position:fixed;inset:0;z-index:20;background:#05070b;
    flex-direction:column;align-items:center;justify-content:center;gap:18px;
    font-size:15px;letter-spacing:.15em;color:#f3ead7;text-align:center;padding:24px}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><iframe id="show" src="./index.html" allow="autoplay; fullscreen" title="偷心行动 · 完整版"></iframe></div></div>
<div id="veil">正在载入…</div>
<script>
/* 让 1280×720 的舞台自适应任意屏幕（含手机竖屏） */
(function () {
  var stage = document.getElementById('stage');
  function fit() {
    var vw = window.innerWidth, vh = window.innerHeight;
    var s = Math.min(vw / 1280, vh / 720);
    stage.style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', fit);
  fit();
  var f = document.getElementById('show');
  f.addEventListener('load', function () {
    var v = document.getElementById('veil');
    v.classList.add('gone');
    setTimeout(function(){ v.remove(); }, 700);
  });
})();
</script>
</body>
</html>
